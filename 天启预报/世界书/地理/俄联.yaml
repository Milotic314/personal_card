位置: 现境大国（天文会五常之一），双头鹫；以滴血教堂、中央救世主大教堂等教堂为谱系分部。
场景: 滴血教堂（叶卡捷琳堡，叶卡捷琳娜统领、培养一百九十一圣堂骑士，槐诗教育安娜并过昼夜之镜试炼处）、中央救世主大教堂（批复委任书处）、中西伯利亚贝加尔山脉（天国谱系"老牧羊人"所在，罗素与老牧羊人密谈处）。
功能: 圣灵谱系分裂后东迁而成的俄联谱系正体所在，圣棺网络遍布；常驻升华者骑士团与装甲教士军团十万人以上，各谱系中军备第一。
历史: 罗素与叶卡捷琳娜交易安娜之事，槐诗任安娜之师；罗素与老牧羊人密谈时被叶卡捷琳娜掳走。
谱系: 俄联谱系（圣灵谱系正统传承）。
危险度: 3（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
