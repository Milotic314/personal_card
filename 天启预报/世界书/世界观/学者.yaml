学者体系（绿灯详表）:
  定义: 学者＝非升华者的知识/定律体系，钻研定律与奇迹；等级链＝学者炼金师创造主大宗师。与升华者阶位是两套并行体系，可双职业叠加（艾萨克＝三十二科学者＋五阶柯罗诺斯）。
  等级链: 学者（有注册名，来自最擅长的定律领域）炼金师（石釜学会垄断现境炼金术）创造主（只要有足够源质，就能宛如神明般修订一切）大宗师（当世仅存约十位）。
  晋升: 学者进阶＝融入自身学科（与升华者受谱系影响相对）；掌握定律、编制定律框架；突破创造主的关键＝超越前人认知（"学位是枷锁"）。
  战力定位: 学者本体弱，力量在框架/装置/机械上；除力学外多数定律争斗时派不上用场；但学者学识被圣痕转化后毁灭力惊人。出手写"定律框架笼罩/修改规则"，不写放波。
  组织: 先导会＝学者组织源头/天文会前身；天文会技术部；石釜学会；象牙之塔；存续院；三贤人系统（理想国事象管理者）；稷下；卡文迪许实验室。
  代表: 牛顿（史上首位创造主）；伊芙琳恰舍尔（深渊生物学）；莉莉（记录操作）；艾萨克（三十二科学者）；萨曼莎（五阶吉祥天＋大宗师）；米哈伊尔（炼金/铸造大宗师）。
  铁律: 别给学者写升华者阶位，要能打就写双职业；学者正面弱，创造主出手写框架修改规则；组织归属别混（先导会/石釜学会/三贤人系统各管一段）。
  触发词: 学者、炼金师、创造主、大宗师、定律、框架、石釜学会、先导会。
