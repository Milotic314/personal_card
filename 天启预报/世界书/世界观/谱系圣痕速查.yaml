天国谱系九路:
  - 天问之路（东夏）：适应与平衡、改造地狱环境。阴魂→山鬼→少司命/大司命→云中君→东君/常仪/常曦→太一（天敌级，超五阶）。
  - 黄昏之路（北欧）：谋略与掌控、军团。英灵→霜巨人→女武神·瓦尔基里→黄昏之王·洛基/海姆达尔。
  - 永恒之路（埃及）：破坏领域、物质加装（最氪金）。骑士→命运战车/太阳船→天狱堡垒·荷鲁斯/冥府巨人·奥西里斯。
  - 神髓之路（希腊）：最具神性、最似神明。泰坦→柯罗诺斯/地母·盖亚。
  - 维持之路（天竺）：奥秘。不动明王→奎师那。
  - 变化之路（斯拉夫）：人性与善恶。侍霜之女→寇斯切→黑神·切尔纳伯格/白神·贝洛伯格。
  - 原始之路（苏美尔）：混沌、最接近地狱本质。虚无深渊·阿卜苏。
  - 循环之路（凯尔特）：多数升华者已自愿舍弃圣痕奠定白银之海。努阿达。
  - 乐园之路（童话系）：小红帽→睡美人→仙德瑞拉→海的女儿。
  - 原罪之路（未完成草创）：死亡天使·萨麦尔。

六大谱系:
  - 东夏：十八条路、绝地天通龙脉、双天敌（褚海·兵主+新一代）。圣痕：天命玄鸟、烛九阴、夸父、麒麟（符残光）、凤凰（白帝子）、腾蛇、睚眦等。
  - 罗马：万神殿体系。受加冕者密涅瓦/维纳斯/阿芙洛狄忒。圣痕：朱庇特（提图斯）、亚努斯（双子天敌）、马尔斯、伏尔甘、赫尔墨斯等。
  - 埃及：第一王朝血脉。天敌阿赫（最古老）。圣痕：阿赫、赛特、透特、木乃伊（法老王）、斯芬克斯。
  - 俄联：正教谱系、军备第一。天敌弥赛亚/撒旦叶。圣痕：弥赛亚、撒旦叶、智天使、座天使、霜父等。
  - 美洲：印加谱系、底蕴不足。天敌羽蛇（库库尔坎）。圣痕：陨落晨星（白冠王）、鹰神（道格拉斯）、熊神（理查德）、羽蛇神等。
  - 天竺：一分为三（毁灭/创造/维持）内斗四百年。天敌青颈（湿婆）。圣痕：湿婆、难近母、犍尼萨、持斧罗摩、梵仙等。

其他谱系:
  - 瀛洲（化物谱系）："能"系圣痕、隐秘机构"座"把持。圣痕：日巫（卑弥呼）、鸦天狗、百目鬼、建御雷神等。
  - 圣灵谱系：曾天下第一大谱系，后分裂为罗马/俄联。圣痕：弥赛亚、撒旦叶、权天使、吸血鬼、人狼、信徒等。
  - 琐罗亚斯德谱系：二宗三际、五条路。圣痕：光王、五明子/五类魔、灯灵。
  - 新罗谱系：七星集团、火犬一系。金首露王、火犬。
  - 冰海谱系：源典"绝界船"失落，弱小。
  - 牧场主谱系：源自毁灭要素牧场主。大衮。

定位: 原创角色选路线、NPC 报圣痕时的锚点；与「圣痕与谱系」总述互补（那条约概念、这条例圣痕名）。
