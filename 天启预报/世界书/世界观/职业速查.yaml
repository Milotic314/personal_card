副职总述: |
  副职是与升华者阶位、凝固阶位独立的第三类体系，可多职业并存（能力.职业 每键一个职业，值={等级,协会}）。
  副职晋升＝事件收尾轻量晋升（见「晋升方式」）：不做完整进阶仪式、不消耗翠玉录/神曲咒语、没有下一目标清单；事件收尾时更新能力.职业.{职业}.等级，协会不变。

灾厄乐师: |
  诸地狱联合音乐协会颁发的职业资格，以音乐/演奏为手段的地狱系艺术职业（精髓=变化）。
  等级三维：证数（一门乐器/声乐一证，如"六证"）、排名（新人靠后如第199名、资深靠前如排行五十）、演奏lv（lv10凡人极限/lv12传奇/lv21顶点）。可现境+地狱双证并拿。

厨魔: |
  以极致口腹之欲深入深渊地狱的料理人（精髓=爆发），比谁做得更难吃。
  星级=硬实力标签（白板→一星→…→九星），黑卡=正式门槛；升星靠战绩+贡献+开拓，由厨魔大赛组委会/厨魔协会评定。纯厨魔（如郭守缺）无升华位阶，战力在祭祀/诅咒料理。

学者: |
  学者未必是升华者，钻研定律与奇迹的知识体系；炼金师从学者中分流（石釜学会垄断现境炼金术）。
  等级链：学者→炼金师→创造主→大宗师（创造主能据定律改变现境/边境/地狱，大宗师当世仅约十位）。学者与升华者可兼得（艾萨克=三十二科学者+五阶升华者）。
