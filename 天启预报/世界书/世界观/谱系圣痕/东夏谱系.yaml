谱系: 东夏谱系（传承数千年的最古谱系，明面十四条+暗藏四条共十八条升华之路；绝地天通后神性化龙脉，迎来黄金世代与双天敌——褚海·兵主、新一代白帝子；另有麒麟、腾蛇、睚眦、白泽、大鹏金翅鸟等百余种圣痕散布各路）
代表圣痕:
  - 心月狐（三阶·天命之路）：主祸乱之象、擅挑纷争，青丘幻术真幻如一｜叶雪涯初始圣痕
  - 钧天白狐（四阶·天命之路）：接续断绝的东方青龙之力，再赋紫薇统治者天命，有入主钧天的潜质｜叶雪涯
  - 天命玄鸟（五阶·天命之路）：天命之路顶点，洞察天命、四平八稳的谱系主宰｜当代谱系之主玄鸟
  - 化蛇（二阶·孽业之路）：以杀意与憎恨为进阶资粮，凝弱水、挥诅咒｜林十九、林瑜
  - 升卿（三阶·孽业之路）：巨蛇虚影祥和暗藏恶毒，断头咒/影缚/怨缠｜林十九
  - 九婴（四阶·孽业之路）：以势压人，驭孽业猛毒，鸣声可破魂魄，可变九首大蛇
  - 烛九阴（五阶·孽业之路）：烛龙割舍神圣面所化，掌控晨昏与恶孽的钟山之神｜林家老祖
  - 建木（三阶·青帝之路）：通天彻地的生机网络支柱，治愈与超广域荆棘光环
  - 句芒（四阶·青帝之路）：青帝之路四阶，衔接建木与青帝｜当代青帝句珏
  - 青帝（五阶·青帝之路）：诸界生机之主，司长生发枯荣，可凭意志催增万物生长年份｜句珏
  - 龙伯之民（三阶·后土之路）：龙伯之国巨人，东夏"龙伯卫"天生持此圣痕的深渊大群
  - 巨人之王·夸父（五阶·后土之路）：体魄强健力大无穷、逐日踏风的极速｜王阿宝（加冕齐天大圣）
  - 天帝少女·姑获（三阶·鬼方之路）：源自鬼方、接续九凤的凶灵，融合瀛洲化物｜里见琥珀
  - 九凤（四阶·鬼方之路）：覆盖九野吞吃天下的圣鸟，食人魂魄，与凤凰同神性
  - 凤凰（五阶·其他）：万劫辟易的天命与涅槃之力｜白帝子·褚清羽（新一代天敌）
