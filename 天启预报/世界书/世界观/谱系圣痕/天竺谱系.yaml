谱系: 天竺谱系——一分为三（毁灭/创造/维持）内斗不休，六大谱系中最薄弱；源典《往世书》，受加冕者因陀罗

代表圣痕:
  - 湿婆（五阶）：毁灭谱系顶端，天敌"青颈"，曾盛怒搅拌乳海倒灌巴格达｜三系合一后为当代谱系之主
  - 难近母（五阶）：毁灭谱系五阶，传承雪山女神帕尔瓦蒂化身杜尔迦｜倾国之赌中战死
  - 卡蒂基亚（五阶）：毁灭谱系之主，传承天竺神话中的战争之神
  - 因陀罗（五阶）：受加冕者，天竺神话中的雷神与天帝｜原外道王，凝固后投奔黄金黎明
  - 犍尼萨（五阶）：创造谱系之主（新就任），传承象头神犍尼萨
  - 梵仙（五阶）：战略级兵器，六道轮回钉入深渊｜石咒仙人
  - 持斧罗摩（五阶）：维持谱系，持湿婆亲锻巨斧｜受加冕者索娜姆·巴兰
  - 奎师那（五阶）：维持谱系五阶，毗湿奴十大化身之一
  - 迦楼罗（五阶）：维持分支，神明的从属与坐骑，天命"开路"
  - 阿耆尼/伐楼那（五阶）：天竺神话中的火神/海神（提及）
  - 摩呼罗迦（四阶）：纳迦上位圣痕，半身长蛇、生有六臂
  - 纳迦（二阶）：八部天龙众之一，毒龙与大蛇｜上座部密宗垄断一系
