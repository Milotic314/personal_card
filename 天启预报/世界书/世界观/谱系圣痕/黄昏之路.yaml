路线: 黄昏之路（源自北欧，核心是"谋略与掌控"——如何驾驭、使用和扩充自己的军团；与军团契约尼伯龙根之戒最搭配，人海战术号称最赖皮的升华之路）
触发词: 黄昏之路、英灵、霜巨人、女武神、瓦尔基里、布伦希尔德、诗寇蒂、赫尔薇尔、诗迦古尔、洛基、海姆达尔、尼伯龙根之戒
圣痕:
  - 英灵（二阶）：由阴魂圣痕经受祝仪式进阶而成的军团兵种，可被尼伯龙根之戒契约为灵活杀戮兵器。｜进阶条件：由阴魂经受祝仪式进阶
  - 霜巨人（三阶）：出了名擅长正面作战，可施展冰霜冻结、化身为巨人，受到的伤害像冰霜凝结一样快速恢复。
  - 女武神·瓦尔基里（四阶）：黄昏之路斗争一面的显化、海姆达尔的前置，能领受逝去神明的祝福与神性质变；上位赐福共四位——胜利获取者·布伦希尔德（最强战斗力）、未来洞见者·诗寇蒂（近乎洞察时光的预判，战争抉择无往不利）、军团守护者·赫尔薇尔（近似少司命的大群豢养与大规模辅助，单人成军）、战争引领者·诗迦古尔（实力随所统领大群的力量上涨）。｜进阶条件：海姆达尔的前置
  - 黄昏之王·洛基（五阶）：火与谎言的主宰、北欧神系的恶之化身、一切幻象和虚假的主宰；对外宣传是掌握策略智慧的"密米尔"，实为第一代谎言之王制造的幌子，有一次使谎言成真的能力（罗素真身）。｜进阶条件：献上一个让所有人都信以为真的谎言——相信的人越多、引发的波澜越深远，得到的天命越丰厚
  - 海姆达尔（五阶）：军略与远见之主，自罗马北欧源典分裂出的人之神、人世与彩虹桥的守护者；与彩虹桥绝佳适配，可随时调用彩虹桥力量在现境领域内天降打击、维护秩序，并将成为三大封锁的关键守护者。
