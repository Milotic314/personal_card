诸神时代: |
  诸神为摆脱天命互相征战、无人善终（北欧率先末日预言、希腊罗马灵活变通、阿兹特克残酷内斗、
  东夏万世一系、天竺诸神各自为政、互相吞噬），于公元 1650 年前后集体陨落，
  神性汇聚成毁灭要素之首"牧场主"。

帝夋与太一: |
  东夏诸神之主帝夋（后为彤姬，日主）为挣脱天命铸造彤弓素矰，射落托纳提乌、赫利俄斯、
  乌图、高天原烈日之主、巴德尔、密特拉等举世烈日（九支帝夋之箭用尽）；
  最终被羲和、常仪以威权铸成的第十支箭（由凡人羿自不周山射出）贯穿陨落，
  转生为婴儿"彤"被羿收养为女。神明之死与太一陨落导致地狱衍生；
  神明尽数归入龙脉（白泽之策），帝夋之友化身三大支柱庇佑现境。
