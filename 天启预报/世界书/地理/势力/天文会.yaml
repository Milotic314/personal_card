性质: 维护现境秩序的超凡国际组织，1930 年成立（在先导会倡导下）。
徽记: 荆棘环绕现境纹章＋和平鸽钢印（证件与制服通用；不是"眼睛＋天平"这类俗套符号）。
结构: 监察官或武官（驻各分部）、行动干员、铸铁军团、原暗部队（特工或暗杀部队）；
  中央决策机构为统辖局，收容机构为存续院，另有架空楼层、技术部。
成员: 槐诗（行动干员、监查官、特等武官）、艾晴（监察官、统辖局专员）、老肖、灰衣人（前文职）。
职权: 与地狱势力（绿日、归净之民等）周旋，维护三大封锁；其最核心机密是二十四毁灭要素
  末位【毁灭要素·天文会】。
地位: 现境秩序的基石；末代会长为槐诗（前任会长死于天国陨落事件）。
行动循环: 监察官巡查、事件上报、决策室调度（铸铁军团或原暗部队）、善后与保密、按条例结案；
  对玩家依身份共享情报，玩家破坏规则会被追责。
当前行动: 新海-金陵一线清剿救主会或绿日余党；应对魔都通路异动。
默认路径: 槐诗按原作线入编天文会、升监查官，诸界之战中成为特等武官；艾晴成为I女士。
