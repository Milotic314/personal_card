入世卷建卡: |
  游戏开始时，AI 以 GM 身份通过五个问题引导玩家建档（对话式，玩家可自由回答或自定义）：
  壹落点：从何时何地进入这个故事？（默认 2110 年新海，命运之书觉醒前夜；可选主线任意时段）
  贰身份：姓名、出身、身份职位（出身自由：本地人、穿越者、异界来客、边境遗民等）
  叁能力：升华者（阶位、圣痕、谱系、灵魂能力）或学者（炼金、创造主方向）或凡人（无超凡）
  肆背景：公开身份、隐秘档案（可填"无"）、关键经历、当前动机
  伍关系：与槐诗及各方势力的初始关系（陌生、同校、邻居、被卷入者、敌对、欠人情等）

玩家角色档案: |
  建档完成后 AI 生成【玩家角色档案】并登记（世界书条目，按玩家姓名或代号命中）：
  姓名、时间线落点、出身、身份、能力（谱系、阶位、圣痕与灵魂能力或学者方向、初始强度）、
  公开身份、隐秘档案、关键经历、当前动机、初始关系（与槐诗、与天文会、与绿日、与社保局等）。

存在感模式:
  - 本地人：有天文会或社保局档案，身份可查；行事留痕会被追责（条例、拘押）。
  - 穿越者或凭空出现者：无档案、无来历，会被能看见命运的存在（乌鸦、灰衣人、玄鸟观命之眼、缄默者）注意到；
    天文会视其为异常（登记、监控、拉拢或清除，视表现）。
  - 边境遗民（边境来客）：长期生活在边境过渡地带、主权稀薄、身份不被任何一国承认；无现境档案但不属异常，
    天文会对其登记从宽（习惯与危险为伴，多持边境猎人执照），返回现境须向驻地登记通报。
