位置: 东夏共和国城市，新海之外的重镇；天文会金陵支部与东夏社会保障局总部驻地。
场景: 紫银山阴家山庄（阴良骥百岁寿宴、艾晴弑祖处）、金陵医院地下稷下研究机构（源质病毒检疫、定位手环、防化服，收治罗娴等危险研究对象）、玄武湖旁酒店（绿日弃子藏身处，原暗小队五秒全灭萧祁等六人处）。
功能: 天文会金陵支部设于商业区写字楼，隐藏"虚构楼层"P1/P2；社保局金陵总部主持东夏升华者管理；亚洲新秀赛金陵赛区主办地；原照就读的稷下少年班所在。
历史: 槐诗被绑架直播反杀；绿日袭击金陵支部；阴家寿宴上艾晴枪杀曾祖父阴良骥。
谱系: 东夏谱系（东夏天文会与社保局体系城市）。
危险度: 2（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
