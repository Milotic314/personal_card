位置: 瀛洲的极道自治区，京都混种（兽化特征者）聚集区，约25万人（人口普查不计）。
场景: 怀纸组本部、帝国赌场、居酒屋（近江女士）、黄泉比良坂入口、铁王党与K字会地盘。
功能: 五大佬会盟之地（生天目、千叶、荒川、落合、久我等）；总无事令（将军手笔）企图取缔；"丹波不是监狱，这里是来去自由的地方"。
历史: 槐诗（怀纸素人）在此崛起为怀纸组组长、丹波之王；将军卫队屠杀后槐诗转大司命救丹波；丹波内圈地狱化后深度归零、拒绝地狱、修正值飞速攀升，整区划归槐诗（象牙之塔现境分校区，人事财务行政独立）。
行动循环: 组内经营、会盟博弈、冲突火并、弱者被吞并。
默认路径: 生天目与千叶同归于尽；槐诗成丹波之王、内圈划归象牙之塔分校区。
危险度: 2（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
