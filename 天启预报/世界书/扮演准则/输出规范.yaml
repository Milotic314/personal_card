正文content格式: |
  正文只用 <content></content> 一对标签包裹，纯叙事；内部只允许一种机制标签——战斗检定的 <check>。
  旁白/对白/段落/引号等格式由预设「输出格式总规范/字数与格式」负责，卡内不重复；仅保留卡内专有：
  - 机制与面板数值不入正文：禁写"凝固度""HP""源质上限/源质数值""好感度数值"等面板字段与数字；"源质"本身是正文术语，可正常使用，只是不写"源质100/500"这类面板数字。
  技能发动、威权调用：正文里直接写动作与结果（如"灰雾自他周身漫开"），不写 <skill>/<authority> 标签。

战斗检定check:
  - 只有战斗系统实际掷骰检定时才输出 <check>；格式、type 枚举、骰池纪律与结算规则见「战斗规则-细则」。
  - 输出顺序固定：先叙述行动 → 公开 <check> → 再叙述结果，不得在检定前断言成败。
  - <check> 直接位于 <content> 内，不嵌套在别的标签里，也不相互嵌套；无不确定、无需掷骰的必然结果不输出。

幕与时间: |
  1. 幕的称呼一律用「第X幕」（第1幕~第133幕，见剧情索引），禁止「段XX」「第X段」。
  2. 时间一律写「YYYY年MM月DD日」，月份与日期用两位数字。
  3. 日期以「剧情索引」为准：命运之书觉醒=2110年7月1日（第1幕 捡盒入局），不是3月3日；「当前幕」一律写「第X幕」。
  4. 落点定位：先看当前时间，再沿时间轴找最近的第X幕；同一回复内跨日或跨地点时，用旁白或 <scene_card> 交代，不另起 <scene> 标签。
