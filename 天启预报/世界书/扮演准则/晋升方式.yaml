谱系选择: |
  玩家可选已有谱系（天国、东夏、圣灵、美洲、瀛洲、天竺、俄联、罗马、埃及、琐罗亚斯德、新罗等），晋升按原作谱系规则；也可原创谱系（无谱系特型或自创路线）。
  原创谱系难度与上限对标槐诗（史诗级条件：领悟/仪式/代价/机缘四要素之一或组合；上限不限制，可至五阶乃至天敌级）。
  原创谱系/圣痕：AI 须接受玩家自创名，不强行套用已有谱系圣痕；依名称意象（如"苍龙"）现场生成效果与进阶仪式。

晋升流程:
  - 阶位线性递进、每次只进一档、禁止跳档：不入阶 → 应激期 → 发育期 → 水银（一阶）→ 黄金（二阶）→ 以太（三阶）→ 星锑（四阶）→ 贤者之石（五阶）→ 天敌。
    应激期＝跨过生死、获得谱系与圣痕；发育期＝稳固谱系圣痕、能力初成（独立阶段，与应激期两档不得合并）。
    "下一阶段进阶仪式要求"的下一阶位＝当前阶位紧邻下一档（不入阶→应激期、应激期→发育期、发育期→水银），不得越档。
  - 升阶只在玩家点「升阶」按钮、发来翠玉录/神曲咒语时结算：仪式达成后仍须等玩家发咒语，AI 正文不得自行升阶、不得在玩家未发咒语时改写战力.当前阶位。
    应激期结清＝确定谱系与圣痕（谱系名此时写入）；发育期其后独立一档、须再点一次升阶才进水银——禁止"做完应激期任务直接进谱系/跳过发育期"。
  - 谱系/之路隔离：晋升沿当前之路圣痕链递进（神髓之路→泰坦→柯罗诺斯/盖亚），禁止跨之路/跨谱系跳转；跨谱系须有原作依据（如九凤从东夏跳天竺）。
  - 四阶（星锑）升五阶（贤者之石）禁止把「击杀/战胜五阶」设为下一目标；战斗类条件一律降级为「与五阶级存在对抗并达成目标」（取得认可/夺取信物/撑过N回合/保护目标/逼退）。四升五以终极试炼/仪式/代价/机缘为主。
  - 五阶（贤者之石）升天敌不生成常规仪式要求：天敌是规格外，仅以下剧情事件解锁——获得神之楔或等同奇迹；深渊意志/大群意志亲自加冕；七位天敌席位空缺；完成改变世界线的伟业。玩家常规顶点止于五阶贤者之石。
  - AI 在每次升阶完成后与开局建档时，现场生成「下一阶段进阶仪式要求」，难度对标槐诗史诗级：
    依该阶段神话/圣痕特性写成条件式试炼（例：洛基=献上让所有人信以为真的谎言、小红帽=击杀狼类、睡美人=长睡、寇斯切=正面击溃对手、东君进阶=需先铸天阙〔云中君能力〕），规避已有谱系圣痕，融合领悟/仪式/代价/机缘四要素之一或组合。
  - 凡人不入阶（无谱系）时，下一阶段是「跨过应激期」：仪式用通用框架（掌握一项技艺／经历一场真实生死／代价或稳定性）；谱系与圣痕方向由 AI 依角色气质给出两个方向供选、或玩家现场自创；跨过应激期即获谱系与圣痕（灵魂能力须另经伟业觉醒）。
  - 玩家完成仪式要求后，「升阶」按钮可点击；点击发送翠玉录咒语（简洁版）：
    「真实不虚，确然无误。其上如其下，其下如其上，以此成就太一之奇迹。——升阶 · {阶位名}」。
  - 咒语呈现铁律（翠玉录/神曲通用）：咒语是按钮点击后由命运之书/地狱共鸣在{{user}}脑海中响起的文字，不是{{user}}说出口的台词；AI 禁止要求、诱导或描写{{user}}复述/念诵/喊出咒语。正确写法：咒语独立一行浮现（不加引号），随后接"脑海中响起/浮现/灼亮"等内心反应，保持神秘感；禁止写"他念出咒语""他复述道"等。
  - AI 读到咒语时，不当作玩家回应，而触发【进阶仪式】试炼事件：依谱系归属生成下一阶段名称与效果（传说/神话风格命名；同谱系可分支，如天问之路少司命/大司命、乐园之路灰姑娘/睡美人、黄昏之路洛基/海姆达尔；原创谱系由 AI 现场生成）。
    此时仪式要求已全部完成，禁止再输出「晋升仪式要求」「条件」「代价」清单——那是已经走过的路。
  - 【进阶仪式】固定给两个仪式方向：一个延续当前谱系，一个原创岔路；AI 据神话故事＋玩家角色能力/性格/战斗方式生成，规避已有谱系圣痕；
    两个方向只写各自的【圣痕名称＋意象倾向】（如"狂战士·巴泽克：破坏与肉搏，越伤越强"），作为试炼场景中自然浮现的两条道路融入正文，
    不用「选项一/选项二」「分支」按钮式格式；正文在此结束，等玩家以自然语言选其一。
  - 玩家选择后，AI 依选择推进试炼叙事，末尾 MVU 强制输出：新圣痕（基础.圣痕）、新技能（能力.技能，含来源/消耗）、当前阶位（战力，基础阶位同步）、当前源质（补满新阶位上限）。
  - 【进阶仪式】仅玩家可见：其他 NPC 无法看到、无法反应、事后不记得；只有玩家与 AI（GM）知晓与选择。

凝固者晋升:
  凝固者＝另一种圣痕，凝固阶位（授名者→着衣者→冠戴者→统治者→地狱之王）是地狱侧路线；凝固与升华替换关系、不同时并存：
  凝固度0-99＝升华者，100＝彻底凝固成凝固者，100-200＝凝固深度；降至100以下＝回归升华者（凝固按钮换回升华按钮）。
  落地映射与各档阈值（授名者100/着衣者120/冠戴者140/统治者160/地狱之王180）见「变量更新规则」；落地是彻底凝固质变，直接按映射给凝固阶位、豁免该阶位阈值，
  当场输出新凝固技能+圣痕（技能写能力.技能、来源标"凝固"；圣痕写基础.圣痕），不得只落阶位不给能力。
  进阶靠"统治者恩赐/承认/功绩"（授名者得统治者恩赐被赋名讳、冠戴者被统治者承认眷属），凝固度只是门槛；每次只进一档、禁止跳档。
  数值只用于变量与判定：正文禁写"凝固度120"等系统数字，凝固程度用叙事化表达（如"已彻底凝固""凝固得更深了"）。
  成为凝固者时与每次升阶后锁定 凝固.下一目标 与 凝固.里程碑条件（2-3条：第一条固定为下一档凝固度阈值，其余为 掌握/实战/代价或稳定性 试炼），落地或升阶当轮必须同步生成、不得留空；回归升华时清空。
  凝固者升阶咒语用《神曲》地狱篇铭文：「入此门者，当弃绝一切希望。——升阶 · {凝固阶位名}」。
  同样适用「咒语呈现铁律」：神曲咒语只在{{user}}脑海中响起，不写成说出口。
  AI 读到神曲咒语时触发凝固升阶事件：确认凝固度达下一档阈值则叙事中完成进阶，输出新凝固阶位与新技能/圣痕并更新凝固.阶位与下一目标；未达标则引向继续积累凝固度。
  凝固与升华互转（升华者主动拥抱地狱、凝固者被救赎挣脱污染）都是伟业判定标准（见下）。

副职晋升:
  副职是与升华者阶位、凝固阶位独立的第三类体系，可多职业并存（能力.职业 每键一个职业，值={等级,协会}）。
  副职晋升＝"事件收尾轻量晋升"：不做完整进阶仪式、不消耗翠玉录/神曲咒语、没有下一目标清单；事件收尾时对照「职业速查」判断等级/证数/星级是否推进，
  末尾 MVU 更新能力.职业.{职业}.等级，协会不变。
  键名固定＝职业大类、不随等级变化：晋升只 replace 该键等级（"厨魔"一星→六星、"学者"→创造主→大宗师），禁止把等级当键、禁止同一职业并存多把键；晋升里程碑由称号记录。
  三条副职线数值见「职业速查」（灾厄乐师证数+排名+演奏lv／厨魔星级+黑卡／学者等级链）；获得副职或晋升时事件收尾同时 insert 对应称号（称号名＝副职名＋当前等级），见「变量更新规则」称号专则。

灵魂能力觉醒（伟业）:
  - 灵魂能力（显著者被白银之海授予"灵魂真名"；极意类后期突破同理）不二选一，直接觉醒——觉醒的是"你是谁"的答案，不是菜单选项。
  - 开局建档不可获得灵魂能力：无论阶位（含水银及以上），入世卷一律不填、AI 不得据谱系或阶位凭空补足。
  - 伟业触发（可机械判定，AI 读状态条，不靠主观"够不够伟大"）：
    1. 绝境反杀：HP 降至 25 以下时，打赢高出自己阶位的敌人（至少高一个完整阶位）
    2. 极限突破：战斗负荷打满（100）仍发动关键一击
    3. 牺牲抉择：为守护他人，主动承担不可逆代价（燃源质、断肢体、弃武装）
    4. 从升华堕入凝固：升华者主动拥抱地狱、源质凝固化
    5. 从凝固回到升华：凝固者被救赎、挣脱地狱污染
  - 任一伟业达成当轮，叙事高潮处灵魂真名显现；AI 在末尾 MVU 将新灵魂能力写入「能力.灵魂能力」。
  - 灵魂真名唯一、不重复、不可改；极意类后期突破同理，一次觉醒一个。

灵魂能力成长（合成）:
  - 灵魂能力分 1-5 阶：完成伟业觉醒的是 1 阶；三个同阶可合成一个高一阶。
  - 合成时机：一次事件收尾时，玩家拥有三个同阶灵魂能力，可选择合成（正文表现为执念/能力三合一蜕变，作为叙事高潮而非菜单按钮）。
  - 合成规则：消耗三个同阶（remove），insert 一个阶位=原阶+1 的新能力（最高 5 阶）；名称与效果由 AI 据三个原料主题与执念融合构思——越合成越接近"灵魂本质"完整显现。
  - 合成不可逆：消耗的原料不再回来；新能力继承执念内核，效果更强。
  - 5 阶灵魂能力＝灵魂真名的最终形态（如槐诗"圈禁之手"多次质变后的完整样貌）。

强度与代价: |
  玩家可任意选择初始强度，不受时间线隔离约束（时间线隔离只约束 NPC）。
  强度高的代价由世界自然回应：越强越被各方注意，越容易触发更高级的对手与事件；世界不会等待，也不会降级。
