路线: 变化之路（源自斯拉夫谱系，与神髓之路完全对立，核心是"人性与善恶"；由黑神与白神为源头演化而成，理想国分裂时遭黄金黎明屠戮几近断绝，后由威权遗物"昼夜之镜"传承）
圣痕:
  - 侍霜之女（三阶）：暴风雪之神"霜父"神性演化的侧面、"雪少女"传说衍化的圣痕，司掌冰霜之力，可令暴雨结冰为立足之处
  - 萃集世间众恶者·寇斯切（四阶）：恶念一系质变圣痕、黑神天命之下位对接（区别于白神下位信使·维斯娜）；将掠夺的灵魂与生命尽数包容于恶念之中，无止境积蓄直至从无穷恶念与杀意中迎来蜕变｜须毫不保留、全力以赴地正面厮杀，击溃对手、毁去其生命并掠夺灵魂融入自身源质
  - 信使·维斯娜（四阶）：白神的下位圣痕
  - 黑神·切尔纳伯格（五阶）：一切人性恶念的真正汇集，以人心恶念为跳板来去无踪，转瞬之间即可从无数负面情绪中萃取、加工、孕育怪物作为战争兵器；至恶之剑是黑神天命的延伸，以近乎无穷恶意为载体所构成的威权
  - 白神·贝洛伯格（五阶）：世间一切灵魂的治愈港湾，所有彷徨和绝望的栖息归宿
