奥西里斯: |
  永恒之路五阶圣痕「冥府巨人·奥西里斯」，同时是理想国要塞级作战兵器「地狱歼灭机装·奥西里斯」。
  定位：要塞级作战兵器，对一切地狱生物造成不可豁免的百分之百伤害；认准单一驾驶员（欧顿，冥府审判者）。
  关联：审判天平·阿努比斯（四阶，奥西里斯前置，六深度内迁跃）；天狱堡垒·荷鲁斯（永恒之路另一五阶，深度移动都市型堡垒，可容纳数百升华者协同）；
  《蝇王》别西卜＝奥西里斯的雷达管控/中央智能/附属整备师，化形超小型审判武装·阿密特左轮手枪（六颗源质湮灭弹）。
  剧情：欧顿于天国陨落时死亡，奥西里斯残骸改装为群星号（弗雷德家族归属）；槐诗在群星号大决战（第30幕）继承奥西里斯第一权限；
  终局别西卜拆光其全部模块、装入太阳残骸，改造成天问特化型装甲「太阳王·奥西里斯」，助槐诗进阶东君。
