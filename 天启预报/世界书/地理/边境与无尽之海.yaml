位置: 现境之外的过渡地带，主权稀薄、可移动；亚洲区域各边境之间因深度变化形成"头顶的海"（无尽之海）。
场景: 暗网（源质网络，三贤人管理）、香巴拉（公共主权的永久中立边境）、无尽之海（星辰号/群星号航行的海域）、灰岸（灰衣人警告"下个月千万不要去"）、石城（金陵附近大型开放边境，框架恶性bug陆沉）、白城（诸路线中转地，塔尖没入无尽之海）、镜界（倒影与正体对应的世界，归净之民饲养边境异种的"笼子"）、五月花号（伪装成现代游轮的风帆船）、龙三角（邪马台遗迹边境，漂移中）、群星号（列车城市，奥里西斯的残骸）。
功能: 边境遗物与升华者多来自此处；移动边境（群星号）由无数车厢在海面拼合而成；
  无尽之海十七条洋流由统治者利维坦签发许可证垄断；彩虹桥（现境第一封锁）环绕串联所有边境。
危险度: 3（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
