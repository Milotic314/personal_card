定义: |
  地狱侧的组织单位：大群之主统率一支深渊族群（狗头人、蛇人、鼠人、鸦群等），
  拥有信仰光轮（额外的源质储备）；授名者是被深渊认可、有正式名号的大群之主。

地狱序列（所罗门七十二序列）: |
  大宗师所罗门据地狱探究的位阶体系（四种主要类型、四种流转形态、八种不稳定变化、
  九种展现方式、七十二个成果，沿用至今半数空缺）；以爵位划分大群之主，
  顶端为足以媲美统治者的"至上四柱"（如阿斯莫德：骑龙异兽、三头、灵魂为货币、掌诱惑与凝固）。

槐诗的大群:
  - 衔烛之鸦：1120 只乌鸦经埋骨圣所蜕变的源质从属，九只为核心，后与怨憎融合。
  - 机械铁鸦 v2.0：铸日者改造（最高 240 米每秒）。
  - 迷梦之笼：介于有无之间的地狱，装源质生物族群。
  - 贝希摩斯（苦痛化身）、乐园护卫队、铁晶座军团（石像鬼、蛇人不死军、深渊鼠人）。

军团: 诸界之战的单位，如槐诗统帅的原罪军团。
