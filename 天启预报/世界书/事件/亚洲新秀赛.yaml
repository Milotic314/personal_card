# 第十九届亚洲新秀赛（邪马台大逃杀）· 赛制规则（第 17-19 幕专属）
概况:
  届数: 第十九届亚洲新秀赛
  时间: 2110 年 10 月 19-25（第 17 幕初赛、第 18 幕终局、第 19 幕落幕颁奖）
  地点: 九号分会场（巨轮）→ 邪马台（沉没的瀛洲古城，深度四的地狱）
  主办: 亚洲新秀赛组委会；巨鹅集团协同举办（心悦框架改造赛场）；明日新闻发行万世牌
  参赛资格: 年龄三十以下、位阶不高于三阶的升华者；本届海选后正式参赛者七千九百余人

心悦框架（赛制核心，务必遵守）:
  框架内被杀 = 自动退场，无生命危险（巨鹅集团赋予的"虚假生命"）。
  "退场" = 失去资格但人没事（原照被送退场后"打点滴休养几天就自然好了"）。
  真死仅两种例外: ①框架覆盖范围之外（如王子城堡深处，系统面板消失处）；②框架内灵魂/圣痕创伤无法弥补而崩溃。
  主动弃权: 前往外围指定地点申请退场。

赛制流程:
  1. 海选/报名 → 登船（九号分会场实为巨轮，横渡暴虐之海驶向邪马台）。
  2. 初赛·大逃杀：城市中无规则律令限制，自由寻找装备、击败敌人、完成任务、夺取胜利；开场一小时退场一千五百余人。
  3. 逢魔时刻：入夜百鬼夜行，一夜两千以上退场。
  4. 第二阶段·十四件关键道具：十四个紧要场所攻略任务，各代表一件邪马台地狱宝物（如幻象臂甲）。
  5. 复活赛·小猫乐园：第一日退场者八小时内通关全部项目=恢复资格；杀主持者可继承其通关进度与装备。
  6. 最终阶段·胜利之门：最终任务【生存】"活下去"；心悦框架向中央收缩，卷入者化为飞灰退场；幸存者定格四十。
  7. 决赛与颁奖：名次由白泽摸鱼定"叶雪涯、罗娴、槐诗"，槐诗获季军与闪银万世牌【乐园王子】。

场景规则:
  - 新秀赛场景中任何"被杀/斩首/屠尽"都是退场（人没事、失去资格），别写成真死。
  - 只有框架外（城堡深处等）与圣痕/灵魂崩溃才可致死。
  - 参赛者限三十岁以下、三阶以内（槐诗、里见琥珀、原照、叶雪涯、罗娴等都在此区间）。
  - 主要参赛者：槐诗（乐园王子/季军）、罗娴（屠场后被槐诗救赎）、叶雪涯（进阶钧天白狐、实为弃权裁定）、里见琥珀（斩长发王子、胜利之门前被罗娴"斩首"=退场）。
  - 落幕：邪马台被玄鸟注册为第三新汴梁市；神之楔被乌鸦裹挟遁入地狱。
