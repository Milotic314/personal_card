起因: |
  现境与地狱的全面战争，因深渊潮汐涨潮而起，潮汐退去则自动结束。
  始自亡国的威权遗物舰队纳吉尔法冲入现境防线。

经过: |
  罗素献地狱哨站、现境防御阵线启动（"边境本身就是城墙"立方体）；赫笛率十六方围剿槐诗
  （铁炎城大爆炸、锈蚀塔林、鹦鹉螺复苏）；波旬收容作战；深渊之赌（第三次，旧盖亚归属）；
  福音圣座、再生计划。

终局: |
  吹笛人以自身死亡完成献祭、湮灭于裂隙虚无，促成毁灭要素·统辖局诞生；
  三大封锁熄灭、太阳熄灭；槐诗重铸现境之太阳、成就天敌·太一（与现境一体）；
  天国计划（释放二十四毁灭要素、92% 表决通过、彩虹桥时间跳跃）开启新纪元；
  槐诗作为唯一观测者（见证者）留守旧世界见证四十五万年，以见证者的特权拆出七条时间线，
  世界线归一。
