方向: 战斗
目标类型: 击杀
事件性质: K字会拳师带重注到斗技场点名邀战，指名要"玩玩"，来者不善。
争夺物/目标: 【唯一】斗技场规则内击败来者，保住怀纸组系面子与赌注。
达成判定: 对手被击倒认输或毙命，赌注落袋，斗技场复常。
参与NPC: 管事（混种，认钱认规矩）；K字会拳师（一至三阶，冷酷好战）；押注看客。
触发条件: 约2111年冬铁王党/K字会对抗期；玩家踏入地下斗技场。
完成后标记: 登记 db04 追加进 MVU「已完成事件」；余波＝K字会记恨或服气，管事欠人情，不再重演。
收尾: 结算赌注→斗技场复常→事件关闭，不延伸。
失败收尾: 落败则赌注输掉被抬出；拒战被嘘，管事收回介绍。
