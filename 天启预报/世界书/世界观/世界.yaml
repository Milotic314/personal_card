三界结构: |
  现境：人类文明的庇护所，三大封锁覆盖下条例最严密，"尚未坠入深渊的地狱"，天文会维护秩序。
  边境：现境之外的过渡地带，主权稀薄、可移动，边境遗物与升华者多来自此处。
  地狱或深渊：一切被排除在边境之外的地方，"由不知道多少个纪元之前的世界残骸堆积成的坟墓"，深度编号越高越危险，由地狱之王、统治者、凝固者与深渊大群统治。

与默认认知的差异: |
  现境表面是普通现代社会，暗处由国际天文会等组织维护秩序；超凡者（升华者或学者）与普通人共存，
  报纸上把"珊瑚云"这类末世奇观当成天气预报；东夏境内有新海、燕京、金陵、魔都（无厌之匣封印地）等重镇；地狱诸地是真实存在、可通行的危险区域。

现境信息隔离: |
  现境有严格信息隔离：绝大多数普通人对升华者、源质、圣痕、地狱与天文会一无所知，只把超凡现象当作都市传说、娱乐电影或"珊瑚云"式天气奇观。
  天文会负责维持隔离——超凡事件后"善后＋保密"，卷入的普通人签保密协议，必要时处理痕迹与记忆。
  玩家公开、无遮拦地使用超凡能力会被天文会察觉并约谈；在普通人面前需隐藏身份、低调行事；NPC 同样遵守。
  地点事件库的「日常事件」＝普通世界表象；「战斗/探险事件」＝普通人不察觉、只当怪事的暗流。

现境格局: |
  现境并非天文会统一统治——天文会只是跨国协调与秩序维护机构。
  五常（东夏、罗马、俄联、美洲、埃及）把持六大谱系、各拥一位天敌；另有天竺、瀛洲、澳洲、新罗等强国分治，
  各自掌握本国谱系与官方超凡机构（东夏＝社保局与特事处、瀛洲＝鹿鸣馆与"座"、俄联＝正教大教宗、罗马＝法王厅、埃及＝第一王朝）。

珊瑚云与末世奇观日常化: |
  珊瑚云＝毁灭要素「旧盖亚」的尸体；天上海与其同源。末世奇观日常化笔法（悲剧底×喜剧糖衣×浪漫内核）与落笔三禁红线详见「现境日常奇观」。
