# 危险度：1新手/2低危/3中危/4高危/5致命；地狱深处一律4-5，深度越大越危险。按深度升序，深度未详者列后。
深度分区: 深度0现境 → 浅海区（人类足迹与哨站）→ 凋零区（统治者战场领地）→ 渊暗区（庞然大物巢穴）→ 静寂区（混沌之海，深度22之下）→ 深渊之底（毁灭要素诞生地，假说经褚海验证）。
地狱深度速查:
  深度一: 古城废墟（巨型拱门，血月下惨白面孔）｜危险5
  深度三: 熔岩流水线（挂钩悬挂活人制物）｜危险5
  深度四: 小猫乐园（邪马台内，失败升华者复活机制的乐园）｜危险4
  深度六: 考古区（技术部深渊考古队捡化石处）｜危险4
  深度七: 巨人战争区（被锁链拉扯的悲泣女巨人；七-八层为祭祀刀出土处）｜危险5
  深度九: 黄昏之乡（沉没型地狱，槐诗王庭）｜危险4 / 原始生命汤（巨兽互相吞食）｜危险5
  深度十: 黑暗囚徒区（坐铁石的囚徒背影；十层以上骸骨才有未死火焰）｜危险5
  深度十二: 尸体工坊地狱（槐诗濒死坠入处；林家九叔在此寻回牧场主牧群）｜危险5
  深度十九: 雷鸣白原/铁炎城（波旬势力武器贸易枢纽；铁炎城为熔岩拱卫的贸易城）｜危险4
  深度二十: 树血之瓮产出地（深度二十以上才有的边境遗物产地）｜危险4
  深度二十一: 范海辛老死地（原版范海辛自我放逐开拓，老死于此）｜危险4
  深度二十四: 吕西安攻克地（深度开拓者吕西安攻克）｜危险5
  深度二十七: 地狱图书馆（可读亡者死亡记录）/ 魔都（原名即新海）｜危险5
  深度二十九/三十一: 大都会、圣城（与魔都同为被封存的禁忌地狱）｜危险5
  深度三十七: 锈蚀塔林（放逐侏儒王尸体所化，五大冠戴者聚落）｜危险5
  深度五十一: 尘埃荒原·萨马拉第三通信中心（原俄联岗哨/理想国开拓基地，废弃数十年）｜危险4
  倒灌区: 疤痕区（深度倒灌形成的卷曲区域，理想国七十年前旧战场）｜危险5
  贯穿十六层: 亡国（枯萎之王宫阙/离宫，至上者宫阙，血税制度）｜危险5
  覆盖数十深度: 雷霆之海（侏儒·巨人之裔为霸主的地狱汪洋）｜危险5
  深渊之底: 深渊·失序殿堂（原初混沌所在，吹笛人旋涡核心）｜危险5
  深度未详·至福乐土: 牧场主领域（归净之民根据地，牧场主的餐盘；终局含第八层胃液之海）｜危险5
  深度未详·无何有之乡: 黄金黎明大本营（移动现境副本/投影，遗世独立之处为其投影）｜危险5
  深度未详·泰坦之海: 凋零区霸主（传承巨人血的深渊侏儒）｜危险5
  深度未详·冰涌峡: 统治者无定花海领域（统辖局第三十探索队全灭处）｜危险5
  深度未详·庞贝城: 伏尔甘镇守的地狱工坊城（受祝神兵工坊）｜危险4
  深度未详·地狱哨站: 理想国遗留（如信号基站般向地狱投送现境力量）｜危险4
  深度未详·龙伯之国: 巨人国度（龙伯卫来源，夸父为龙伯卫之主）｜危险4
  深度未详·福音圣座: 悲鸣号活化地狱堡垒（至福乐土打造，内含万世乐土/圣都模拟现境）｜危险5
  深度未详·迦南: 遗世方舟（绿日据地，可自主航行于七十以上深度的独立世界）｜危险5
  深度未详·边狱林勃: 存续院试验区与现境界限（创造主·罗丹最后遗作，净化序列怪物来源）｜危险5
  深度未详·无归者墓地: 地狱开拓者大联盟（深渊顶层人才市场/交易平台）｜危险4
