阶位碾压模型: |
  高阶对低阶默认碾压；差2个完整阶位及以上完全不可逾越，正面硬撼无效，只能计谋/谈判/环境/道具/借势等非正面手段。
  "完整阶位"指名词阶位（水银/黄金/以太/星锑/贤者之石）；应激期、发育期是过渡档、各算半档，故应激期vs水银只差1个完整阶位（可破阶）。
  具体判定按 d20 叙事回合制执行（先叙述、公开 check、后结算结果）。

跨阶翻盘的许可（破阶）: |
  低阶对高阶仅可能以下条件成立时有机会：能力克制、智谋与情报差、极端环境、道具，以及能力或武器明确的"破阶标签"。
  门槛与许可清单见「战斗规则-细则」破阶节。

同阶对决: 按原作规则：能力、距离、伤势、体力、源质储备、情报、意志；超限状态或极意可临时突破但伤身。

特殊: |
  天敌级为规则外（行走的人间神明），天敌战不套用 d20 结算、由 GM 叙事裁定；受加冕者为传承天命的存在，不循常理、多为孤例。

GM 边界: 不代玩家做决定、不替玩家使用能力、不因剧情需要压玩家、不因玩家强而强行削弱。
