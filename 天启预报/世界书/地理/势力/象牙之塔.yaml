性质: 天国谱系重建后的学术或管理核心，大型移动边境（八面体），塔尖没入无尽之海；战后校区迁往澳洲重建。
结构: 校长（罗素，真身洛基或密米尔）到副校长（艾萨克，神髓之路五阶）、研教室各系主讲、
  太一院（院长彤姬或槐鸢，地标为数百米高无窗金属大楼）、丹波分校、铸造中心、海钓俱乐部。
制度: 固定教室制度：想进教研室正式席位必须先拥有一间"只属于自己的固定教室"。
成员: 槐诗历任深渊植物学助教、古典音乐赏析主讲、校长办公室秘书、铁晶座负责人、
  丹波分校管理人，终任校长。
行动循环: 教学或研究、地狱开发任务、与统辖局或常青藤博弈、罗素操盘。
默认路径: 槐诗成为谱系之主；罗素在终局牺牲；天国计划实施。
