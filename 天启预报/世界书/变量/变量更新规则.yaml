变量更新规则:
  全局:
    根: [当前时间, 当前地点, 当前事件, 当前幕, 战斗状态, 玩家档案, 物品栏, NPC档案, 世界, 系统]
    允许操作: [insert新建或追加(数组用/-), replace只改已存在路径, delta只对数值, remove只删失效节点, move只迁移同一完整对象]
    禁止操作: [add, copy, test, 用insert+remove模拟迁移, 覆盖九个根, 对玩家档案.称号remove/move]
    依据: 只依据本轮正文直接证实的变化，不从旧剧情重复提取；对白/旁白/推理/规则说明不写入；无证据或无法确定时保持原值。
    正文禁系统数值: "凝固度""HP"等面板字段名与具体数值一律不写进正文，只以叙事化表达；源质是正文术语可正常使用，但禁止面板数字（如"源质100/500"）；变量更新只落JSONPatch。
      每轮必做: [①calculate time passed 的结果用 replace 写入 当前时间.日期/时刻（日期推进必须写进变量，不得只写在正文）；②按需 replace 更新 当前幕.部/幕号/幕名/状态，幕被跳过时状态写已跳过并注明原因]
    建档: 首次建档读取人设世界书写入仍为默认值的稳定档案（初始化非升阶，常态/当前阶位同步）；建档后人设只核对不覆盖。
      建档后检测缺失：谱系或阶位已设但能力.技能为空时，依谱系/阶位补足对应阶位圣痕技能（来源写圣痕），不得留空；
      技能已存在但效果/消耗/来源为空时回填完整；灵魂能力开局不可获得、不据谱系阶位推导，只在伟业时写入。
      建档后立即依「晋升方式」生成下一阶段进阶仪式要求，写入成长.下一目标与成长.里程碑条件（2-3条：掌握/实战/代价或稳定性），不得留空。
        人设已填副职：insert 能力.职业.{职业}={等级,协会}（协会缺省按「职业速查」），并同轮触发副职称号联动。
        人设已填凝固度：replace 凝固度 为所填值（0-200）；达100按「凝固者晋升」落地 凝固.阶位 与 凝固.下一目标。
    顺序: [先腾空会被占用的唯一槽位, 再move完整对象, 最后replace迁移后对象的可变子字段]
    路径: [JSON Pointer ~写作~0、/写作~1; 动态对象以姓名或物品ID为键, 数组追加用/-]

  原子迁移:
    NPC进场: /NPC档案/不在场角色/${姓名} → /NPC档案/在场角色/${姓名}
    NPC离场: /NPC档案/在场角色/${姓名} → /NPC档案/不在场角色/${姓名}
    主角装备主手: /物品栏/${物品ID} → /玩家档案/当前武器（当前武器为空时）
    主角装备副手: /物品栏/${物品ID} → /玩家档案/副手武器（主手已满时；最多两把=主手+副手，两把均满不可再装备）
    主角卸下主手: /玩家档案/当前武器 → /物品栏/${物品ID}
    主角卸下副手: /玩家档案/副手武器 → /物品栏/${物品ID}
    主角换装: 先卸旧→/物品栏/${旧ID}，再/物品栏/${新ID}→对应手（主手优先）
    主角丢弃/被缴械: /玩家档案/当前武器 或 /副手武器 → /当前事件/场景物品/${物品ID}
    主角拾取: /当前事件/场景物品/${物品ID} → /物品栏/${物品ID}
    主角拾取并装备: /当前事件/场景物品/${物品ID} → /玩家档案/当前武器（主手为空时）
    NPC装备/收起: /NPC档案/${角色表}/${姓名}/随身物品/${物品ID} ↔ /NPC档案/${角色表}/${姓名}/当前武器
    主角发动能力: path=/玩家档案/当前源质，check=扣源质消耗与负荷，不足不可发动

  称号专则:
    - 称号=只增不删的功绩勋章；阶位=功绩量级，与战力阶位独立（凡人也能拿1-2阶）；与灵魂能力伟业并行不重复，高光时刻同轮双轨。
    - 授予时机: 事件完整收束、当前事件.阶段写"事件结束"同一轮，与系统.已完成事件追加同轮判定；未收束禁止预授；禁止追授旧剧情。
    - 伟业判据: 主角完成一个有真实挑战性的完整事件（以弱胜强/扭转必败/以命相搏/独自改变结局/影响格局），且有被见证或可传颂余地；同一事件至多1个。
    - 阶位表: 1阶=有挑战的完整事件(+1~+2或小场合优势)；2阶=人生第一次/超出舒适区(特定情形+3)；3阶=以弱胜强(跨场合持续中等)；4阶=绝境反杀/改变主线(局部战局或大范围威压)；5阶=现境级/天敌级伟业(低阶能力或威权)。
    - 效果约束: 称号名2-6字（主力4字），效果一句话≤15字（常规8-12字），格式【称号名】——效果；AI据情境构思、不预列举；强度不超过对应阶位；多称号并存只取最高阶位（同级取最近）效果生效，其余作荣誉记录。
    - 防平凡/防通胀: 同名唯一；同一事件至多1个；重复同量级事件不重复产新；不据旧剧情追授。
    - 副职联动: 获得副职或副职晋升（能力.职业 新增职业或更新等级）时，同一事件收尾insert对应称号：称号名=副职名+当前等级（如"厨魔"→"六星厨魔"），阶位按副职量级取1-5阶，效果一句话写该职业此等级权利/待遇；与伟业称号互不挤占、只增不删、不重复。

  字段规则:
    当前时间.日期: 明确跨日或开场日期被可靠确认时更新，不虚构分钟级精度
    当前时间.时刻: 清晨/上午/中午/下午/傍晚/入夜/深夜/凌晨或明确钟点变化时更新
    当前地点.名称: 实际进入新场所或叙事镜头转移时更新
    当前地点.区域: 跨现境、边境、地狱或具体城区时更新
    当前地点.环境: 只记录影响当前行动的稳定环境要素，失效后清空
    当前事件.名称: 进入当前幕内新核心事件时更新，填事件名不填幕编号（幕号归当前幕.幕号），不当章节日志
    当前事件.阶段: 推进到可辨识阶段时更新，完整收束写事件结束
    当前事件.场景物品: 物品出现insert完整对象，取得/毁坏/消失move或remove
    当前幕.幕号: 进入新幕时replace为第X幕编号
    当前幕.部: 进入新部时replace为第X部
    当前幕.幕名: 随幕号同步填该幕事件名
    当前幕.状态: 未开始/进行中/已完成/已跳过；幕号切换时旧幕改已完成或已跳过
    战斗状态.是否战斗中: 敌对行动开始true，威胁解除且战后结算完成false
    战斗状态.当前回合: 战斗开始为1，新轮加1，结束归0
    战斗状态.参战角色: 参战insert，退出或死亡结算后remove，结束清空
    战斗状态.行动顺序: 先手确定后写入，每轮按序推进，结束清空
    战斗状态.当前行动者: 行动移交时更新，结束为null
    战斗状态.行动额度: 开始为每个行动单位建立，新轮恢复为1，使用后改0，结束清空
    战斗状态.上次检定: 只存最近一次真实公开检定，新检定覆盖；总值=骰面+总修正；失败或无法破阶伤害必须为0；骰面须与正文check一致
    玩家档案.基础.姓名: readonly，初始化后禁止修改
    玩家档案.基础.性别: 玩家设定或可靠剧情证据明确时更新
    玩家档案.基础.年龄: 玩家设定、明确得知或实际跨年时更新
    玩家档案.基础.当前身份: 身份确实取得、失去或改变时更新
    玩家档案.基础.当前势力: 加入、退出、叛离或归属改变时更新
    玩家档案.基础.种族: 真实种族被可靠证据揭示时更新
    玩家档案.基础.谱系: 获得圣痕谱系时更新，无谱系特型写无谱系
    玩家档案.基础.外貌: 建档时写稳定辨识特征，永久变化时更新
    玩家档案.基础.圣痕: 对象{名称,日常,激发}（两态只写外在痕迹/异象、不是能力，见「圣痕与谱系」）；建档/获得时补全不得留空；能力写能力.技能；只有晋升成功才更新（remove旧insert新）；同一圣痕名只允许一条，重复时保留最新、remove旧；圣痕替换只换称谓与意象，已获技能不消失
    玩家档案.战力.当前阶位: 建档优先人设常态阶位；数字阶名先映射名词（一阶=水银、二阶=黄金、三阶=以太、四阶=星锑、五阶=贤者之石）再写入；阶位未知只由可靠证据解析、不靠里程碑递进；不入阶→应激→发育→水银→黄金→以太→星锑→贤者之石→天敌递进；只有事件结束且目标条件全部完成才结算；升阶结算时基础阶位同步更新
    玩家档案.战力.爆发态/极限态: 临时能力生效写完整对象，结束后改null
    玩家档案.当前源质: 能力发动扣对应消耗；恢复=静坐/冥想每小时回上限10%、短休（整轮放弃进攻且脱离威胁）20%、完整睡眠回满、战斗中不自动恢复；上限随阶位（不入阶0/应激20/发育50/水银100/黄金200/以太500/星锑800/贤者之石1200/天敌9999）；建档（初始化）与进阶时均补满
    玩家档案.能力.技能: 获得新技能insert完整记录（效果/消耗/来源/发动负荷/每回合维持负荷/使用条件/特殊限制/破阶标签），只增不删；来源写圣痕/武道/灵魂能力/其他；主动=消耗源质或发动负荷>0，被动=全0常驻；获圣痕生成1主动+1被动；消耗对象{源质/生命/修正值/歪曲度}为0不写；条件/限制/标签为数组
    玩家档案.能力.灵魂能力: 完成伟业时insert完整记录（效果+阶位=1）；三个同阶在事件收尾合成时remove三个原料、insert一个高一阶（最高5阶，效果由AI据原料主题融合构思）；合成不可逆，未合成只增不删
    玩家档案.能力.威权: 获得神明级权能/神之楔/成为毁灭要素时insert，buff类无源质消耗持续生效；毁灭要素威权=领域/灾劫权能，限制含"非全知全能""受前提与代价约束"
    玩家档案.能力.职业: 与升华者/凝固阶位独立，可多职业并存；键名固定职业大类(灾厄乐师/厨魔/学者)不随等级变（禁止等级/星级当键）；获得insert，晋升只replace该键{等级,协会}，禁止同职业第二把键；见「职业速查」
    玩家档案.能力.职业.${职业名}.等级: 晋升只replace该键等级(如"厨魔"一星→六星、"学者"→创造主→大宗师)；同职业始终一把键；里程碑由称号记录（见称号专则）；不做完整进阶仪式、不消耗翠玉录/神曲咒语
    玩家档案.能力.职业.${职业名}.协会: 首次获得时写入所属协会(音乐协会/厨魔组委会/象牙之塔等)，之后不变
    玩家档案.武器: 已弃用勿写；所有武器一律 insert 到 /物品栏/{物品ID}，装备状态只由 玩家档案.当前武器/副手武器 表示。武器完整对象：{物品ID(键=物品ID),名称,类型:"武器",武器类别(≤4字，写形态/兵种如刀/长枪/火枪/扇子，助AI理解),阶位,基础伤害,命中修正,破阶标签,弹药或充能,状态,特殊效果(数组，每条≤20字，只写实际效果，无则[]),有效距离}；基础伤害按阶位区间取整：不入阶1-4/应激2-6/发育4-8/水银6-12/黄金10-18/以太14-24/星锑20-30/贤者之石26-40/天敌30-50，不得越阶
    玩家档案.当前武器: 主手，只有装备后存在；装备/卸下/换装/丢弃/缴械/拾取必须move完整对象
    玩家档案.副手武器: 副手，只有装备后存在；最多两把（主手+副手），两把均满不能再装备；装备/卸下必须move完整对象
    玩家档案.HP: 伤害与治疗只改当前，限制0至100
    玩家档案.HP.上限: readonly，固定100，禁止修改
    玩家档案.战斗负荷: 能力发动与维持增加当前，休息或明确恢复减少当前
    玩家档案.战斗负荷.上限: readonly，固定100，禁止修改
    玩家档案.掩体状态: 进入或离开有效掩体时更新
    玩家档案.当前状态: 只保存影响当前行动的短期状态，正常时仅保留正常
    玩家档案.当前形态: 常态/爆发/极限或其他实际形态变化时更新
    玩家档案.当前目标: 战斗或紧迫行动中的直接目标变化时更新，结束后清空
    玩家档案.生理状态: 健康、轻伤、重伤、疲惫、饥饿等身体状态变化时更新，治疗恢复后改回健康
    玩家档案.当前服饰: 穿着改变时更新
    玩家档案.伤势: 暴击、单次伤害至少25或正文明确重大创伤时insert，恢复HP不自动remove
    玩家档案.濒死: HP降至0或濒死检定结算时更新
    玩家档案.生死状态: 与HP及濒死计数一致，0HP不自动死亡
    玩家档案.修正值: 做出对现境存续有利的重大行为时增加，幅度呼应原作大数字(数百至数千)
    玩家档案.歪曲度: 做出对现境存续有害的重大行为时增加，幅度呼应原作大数字
    玩家档案.凝固度: 0至200；接触地狱深处/被污染/用凝固侧能力/被凝固者污染/主动拥抱时增；净化/救赎/挣脱时减；0-99升华者，100彻底凝固，100-200凝固深度；降至100以下回归升华者（按钮换回）
    玩家档案.凝固.阶位: 凝固度达100按当前阶位落地（不入阶/应激/发育/水银→授名者，黄金/以太→着衣者，星锑→冠戴者，贤者之石→统治者，天敌→地狱之王），不从授名者重来；升阶需达阈值（着衣者≥120/冠戴者≥140/统治者≥160/地狱之王≥180），每次只进一档；降至100以下改回无
    玩家档案.凝固.下一目标: 成为凝固者后立即生成下一档阶位与阈值(如"进阶着衣者·凝固度120")；落地当轮必须生成、不得留空；升阶结算后锁定；回归升华时清空
    玩家档案.凝固.里程碑条件: 2-3条字符串数组，第一条固定"凝固度：达到{下一档阈值}"，其余类型取 掌握/实战/代价或稳定性；与下一目标同轮生成、不得留空；正文明确完成才在条目后追加"（已完成）"
    玩家档案.成长.下一目标: 开局建档后立即生成"下一阶段进阶仪式要求"（如"进阶黄金"），依晋升方式对标槐诗史诗级难度；每次升阶结算后锁定
玩家档案.成长.下一目标.阶位约束: 四阶升五阶禁止生成为"击杀/战胜五阶"，战斗类条件降级为"与五阶级存在对抗并达成目标（取得认可/夺取信物/撑过N回合/保护目标/逼退）"；五阶升天敌不生成常规下一目标，仅剧情事件解锁（获得神之楔或等同奇迹/深渊或大群意志加冕/七位天敌席位空缺/改变世界线的伟业）。
    玩家档案.成长.里程碑条件: 0至3条；有目标时锁定2至3项(至少一项掌握一项实战)；圣痕进阶/天敌/威权目标还须代价或稳定性条件；正文明确完成才改已完成
    玩家档案.成长.已完成里程碑: 0至12条；只在合法升阶同一更新中归档旧目标、事件、时间、前后阶位；超12条先remove最旧再insert最新；阶位未变禁止新增删除改写历史
    玩家档案.称号: 伟业判定、获得/晋升副职或成为毁灭要素时insert完整称号对象至末尾，只增不删；禁止remove/replace/move已有称号字段；伟业称号每事件至多1个，副职称号（副职名+当前等级）获得副职或每次晋升各1个，毁灭要素称号（毁灭要素·{名字}，名字≤4字）1个；三者互不挤占、同名不重复；不追授旧剧情；称号对象字段固定{称号名,阶位,效果}，禁止把称号名写成"名称"
    物品栏: 主角所有物品与未装备武器都存放于此；装备/拾取/丢弃/交易/失去必须保持唯一归属；武器固定1实例（装备=move到当前武器/副手武器，卸下=move回物品栏），普通物品数量为正整数、耗尽remove
    物品栏.${物品ID}.物品ID: readonly，创建后禁止修改，对象键必须等于物品ID
    物品栏.${物品ID}.名称: 必须写物品实际名字，禁止留空、禁止用物品ID当名称；键等于物品ID，名称才是显示与正文引用的名字
    NPC档案.在场角色: 首次出现且具姓名、持续关系、重要情报或后续价值时insert完整档案；返场必须从不在场角色move，禁止重复insert；路人杂兵结算后remove；有名NPC死亡时生死改死亡、move到不在场保留档案
    NPC档案.${姓名}.阶位: 依据明确战绩、档案或形态变化更新；数字阶名必须先映射名词（一阶=水银、二阶=黄金、三阶=以太、四阶=星锑、五阶=贤者之石）再写入；过渡档写应激期/发育期，未知写阶位未知；临时力量不得写入
    NPC档案.${姓名}.好感度: 每轮检查NPC亲历或可靠获知且与主角直接相关的态度事件，无触发保持；普通互动-5~5，重大帮助伤害-6~15，救命背叛-16~30；方向依立场性格利益；相同行为递减；陌生默认0；-200~-151死敌，-150~-101仇恨，-100~-51敌视，-50~-21反感，-20~20中立，21~50友善，51~100信赖，101~150亲密，151~200生死羁绊
    NPC档案.${姓名}.恋人: 玩家与该NPC告白且被对方接受时，replace为 true；未告白或未接受保持无该键；分手/死亡/关系陌路时remove该键。此标签与好感度并行，不替代、不影响好感度数值。
NPC档案.${姓名}.与主角关系: 记录敌人、同学、同伴、上下级等客观关系，关系身份实际改变时更新
    NPC档案.${姓名}.当前位置: 在场随转场更新，离场记录最后可确认位置
    NPC档案.${姓名}.当前行动: 在场用短句记录正在执行的直接行动，结束后清空
    NPC档案.${姓名}.当前情绪: 在场且情绪明显变化时更新
    NPC档案.${姓名}.当前心声: 只记录NPC当下内心，不等同主角已知事实
    NPC档案.${姓名}.与主角距离: 在场移动改变距离带时更新
    NPC档案.不在场角色: 有后续价值的在场NPC离场move完整档案至此；不发送完整档案给模型，只在本轮正文提供可靠远程信息时更新；返场move回在场，任何姓名不得同时存在于两张表
          世界.修正值/歪曲度: 随主线幕推进按幕条目"世界偏差"更新；玩家重大改变主线行为才额外撬动
    世界.危险度: 依据世界歪曲度与主线阶段推导，仅用于状态栏氛围展示；枚举四档：平静/紧张/危机/濒临毁灭
    系统.已完成事件: 事件完成收尾时把事件ID追加到列表末尾(格式"xh04,db01"，用事件库短ID)，只增不减；ID必须来自本卡事件清单；玩家删除通过前端按钮
    系统.随机事件开关: 玩家明确关闭或开启时更新
    系统.随机事件冷却: 每轮递减，归0后可用，触发事件后重置
    系统.上次方向: 触发随机事件时记录方向，用于下次方向轮换
    系统.当前目标: 探险目标单槽位，达成或放弃时清空
