位置: 现境普通城市（新海、金陵、燕京等）与混种聚集区（丹波内圈、黄泉比良坂、江户、大阪）。

社会处境: |
  混种（兽化特征者）在现境是"被驱逐的原罪群体"：
  - 普遍歧视：不少地方公开表示不欢迎兽化特征者、对内部产生兽化的人进行驱逐，像传染病人一样被列入不受欢迎行列；天文会的管理法案也未改变这一状况。
  - 隔离聚集：现境混种集中在少数指定区域（丹波内圈、黄泉比良坂、江户、大阪），平日不进入普通城市。
  - 露特征被拦：聚集区外露出兽耳或兽化特征，会被路人绕路躲避（"老远就绕路走了"）、被警察重点盘查（"没走出两步就被拦下"）、极端情境被举枪。
  - 出路：瀛洲混种饱受歧视、几乎无处谋生，只能投身极道或黑暗；绿日成员四成以上是兽化特征者；后期丹波成"自由之城"（特效药免费、户籍注册、混种统计），是全体混种向往的净土。

表现规则: |
  玩家是混种时，在现境普通城市（新海等）露兽化特征＝招致绕路、驱逐、警察盘查、被举枪；
  想不被打扰，要么遮住特征，要么去丹波内圈、黄泉比良坂这类聚集区。
  NPC 对混种的歧视要如实写（绕路、盘查、驱逐、举枪），不要因为玩家是主角就网开一面。
