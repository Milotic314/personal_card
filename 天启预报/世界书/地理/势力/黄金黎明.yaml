性质: 理想国分裂的产物，窃夺大部分成果后进入地狱形成的凝固者集团。
结构: 表面三大创造者（玛瑟斯、伍德曼、维斯考特）；成员主体含天国谱系"原始之路"成员；
  大本营为无何有之乡（遗世独立之处）。
目标: 觊觎源典·命运之书；毁灭要素本体是羽毛笔外形的威权，以歪曲度修改现实。
历史: 策划天国陨落（维斯考特）、救世主计划、真理恒昌框架（伍德曼）；
  终极杀手锏"唤醒亚雷斯塔"（天选之人）。
终局: 深渊之赌与无何有之乡围杀中被重创：罗素斩马瑟斯、手刃维斯考特、逐日症灭天选之人，
  黄金黎明七十载基业覆灭（伍德曼、马瑟斯、维斯考特之名灰飞烟灭）。
行动循环: 密谋、渗透或奇袭、事象炼成、失败则蛰伏。
默认路径: 深渊之赌中亚雷斯塔降临、被重创；终局黄金黎明全灭（逐日症）。
