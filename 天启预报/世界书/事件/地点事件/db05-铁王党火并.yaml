方向: 战斗
目标类型: 击杀
事件性质: 铁王党与K字会当街火并，弹雨波及路人，玩家被卷进。
争夺物/目标: 【唯一】脱离弹雨区自保，并救下被波及的受困路人。
达成判定: 玩家脱身，受困路人获救，街道复静。
参与NPC: 铁王党枪手（一至三阶，旧式火器）；K字会打手（一至三阶，持刀带枪）；猫耳摊贩（混种，抱头躲藏）。
触发条件: 约2111年冬两派对抗期；玩家行经内圈街道，枪声骤起。
完成后标记: 登记 db05 追加进 MVU「已完成事件」；余波＝街道留弹痕、两派各退，路人记恩，不再重演。
收尾: 结算战果→街道复静→事件关闭，不延伸。
失败收尾: 重伤或被误认同党，由摊贩送医；两派记下玩家。
