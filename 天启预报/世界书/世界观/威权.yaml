定义: |
  威权是神明级的权能，凌驾于圣痕、灵魂能力与源质武装之上的第四类能力，
  对应"威权遗物"（尼伯龙根之戒、命运之书、神之楔等）。威权作为常驻 buff 使用，不消耗源质。

示例:
  - 终末之兽（槐诗）：阴影之心、瘟疫之血、魇魂之齿、溶解之胃、受咒之鳞、铸造之息。
  - 太一（槐诗）：与现境一体、不受修正值桎梏，掌控现境乃至宇宙常数。
  - 羽毛笔威权（黄金黎明）：以歪曲度修改现实。
  - 神意修订：全能之神的神性威权，否定现实、随心改写（仅太一与牧场主用过）。
  - 神之楔：神明死亡后遗留的唯一权柄，通往天敌之路（如太一的神之楔、凤凰的神之楔）。

特性: |
  威权多为"权柄"而非"招式"，一经持有即持续生效；玩家可获得威权遗物或神之楔承载的威权。
