理想国工程:
  第一工程·查拉图·斯特拉如是说: |
    断绝所有秘仪的大秘仪，围绕现境制造稳定环境与物理规则（牛顿与后来学者营造，以琐罗亚斯德谱系部分源典为基石）。
    规则取代旧世界依赖神恩的魔法系统，涵盖力学、热学、电磁学、相对论、量子力学及热武器；热武器对升华者有效，连第五阶段贤者之石也有陨落记录。
  第二工程·彩虹桥: 现境与边境的衔接通道，可大量转移人力；亦被用作时间跳跃（代价沉重，如两千九百平方公里绿地永久沙化换送回24天前）。
  第三工程·白银之海: 赋予全人类共有灵魂、对渗入流毒予以压制的工程；核心为所有人类源质投影汇聚之海。升华者需穿过白银之海完成升华；白银之海守卫者守在此处。
  第四工程·天国: "没有地狱存在的世界"；试运行时黄金黎明埋下的畸变爆发污染而崩溃（天国陨落）。

三大封锁:
  查拉图·斯特拉如是说: 第一工程，物理规则秘仪（断绝所有秘仪的大秘仪）。
  彩虹桥: 第二工程，现境与边境统和（可大量转移人力、可时间跳跃）。
  万物终亡: 现境固有属性、非人设立，为一切封锁下之物添加死亡概念，对统治者杀伤最大。

区分: 三大封锁＝查拉图·斯特拉如是说＋彩虹桥＋万物终亡；理想国工程＝查拉图斯特拉＋彩虹桥＋白银之海＋天国（前两者重叠，白银之海与天国为额外工程）。

三大轴心（三柱）: |
  支撑现境的三根柱石：源质之柱投影白银之海、神髓之柱具现天国、变化之柱支撑三大封锁。
  深渊之赌中三柱于旧盖亚碎片显现投影；三柱失衡即现境裂缝（世界伤痕），存续院每年耗20%以上资源遏制。
