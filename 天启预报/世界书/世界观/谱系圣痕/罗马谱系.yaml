谱系: 罗马谱系（圣灵谱系分裂后的产物，法王厅主导的"万神殿"体系，统和罗马与希腊诸国奇迹；受加冕者密涅瓦、维纳斯、阿芙洛狄忒）
代表圣痕:
  - 朱庇特（五阶）：天父圣痕，罗马皇帝专属｜提图斯六世（受加冕者）
  - 亚努斯（五阶）：双面神，曾洞开天门令诸界无暗｜双子天敌卢基娅/卢基乌斯（金宫之手）
  - 马尔斯/阿瑞斯（五阶）：火星之主、战争之神｜马尔斯为前代战争宗座受加冕者
  - 伏尔甘（五阶）：火焰与锻造之神，庞贝城之主、受祝神兵工坊
  - 赫尔墨斯（五阶）：商业、旅行与盗窃之神｜隶属法王厅墨丘利机关
  - 得墨忒尔（五阶）：耕种与丰收之神，位同东夏青帝，可加速升华者成长
  - 密涅瓦（五阶）：智慧之神，万神殿新受加冕者
  - 维纳斯/阿芙洛狄忒（五阶）：爱与美之神，万神殿新受加冕者
  - 狂猎（四阶）：万神殿四阶圣痕
  - 卡托布莱帕斯（三阶）：美杜莎子嗣，被瞪一眼即身中猛毒
