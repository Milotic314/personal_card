位置: 瀛洲关西古都，里见家产业所在地。
场景: 里见家奈良郊外庄园（当主遴选与御前厨魔试合会场）、奈良梦幻乐园（鬼屋主题"惊悚怨咒病栋"）、断头杀人魔出没的古城街巷。
功能: 里见氏（八犬士）本家所在；御前厨魔试合与里见家主遴选交织之地；关西华族与黑道势力交汇的古城。
历史: 奈良市内连续半月出现斩首杀人魔（已十六人）未破；高野山怨僧（圣痕·土蜘蛛）在列车上袭击里见真希，被槐诗斩杀；地龙众在梦幻乐园绑架真希，被槐诗反杀；琥珀进阶姑获、继任里见氏家主。
谱系: 瀛洲谱系（化物谱系；里见氏八犬士一脉）
危险度: 2（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
