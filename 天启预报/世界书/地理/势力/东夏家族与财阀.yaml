性质: 东夏谱系相关的世家、纯血家族与财阀速查（正文提及对应家族时命中，参考类）。

世家:
  阴家（阴氏）: 金陵本土世家（艾晴出身）；家主阴崖；中兴之主阴良骥被艾晴在寿宴上射杀。
  戚家: 戚问家族的航运物流+走私集团，与救主会/归净之民勾连，被艾晴牵头清理；槐诗灭门帮凶。
  槐家: 槐诗家族；曾祖父槐广四阶升华者、建"灵棺"失败反赋予石髓馆源质；遗产约四千万美金由魔金银行侏儒运营。
  林家: 孽业之路纯血怪物世家，当代烛九阴·林老太爷坐镇震慑东夏九狱；林十九、林瑜。
  原家: 纯血者家族（原照、原缘），圣名传承者（传家碧血/一骑万乘/我心如铁）；小姨在象牙之塔经营牧场。

财阀:
  太清重工: 东夏财阀（边境开发、觊觎龙三角），支持里见琥珀。
  巨鹅集团: "用钱创造快乐"；新秀赛协同主办、企鹅机器人、AI 虚拟偶像"槐诗子"。
  瑶池娱乐: 偶像经纪公司，欲签"槐诗"。
