强化方式: |
  玩家或 NPC 变强的路径汇总（不只靠升阶）：
  - 跨过应激期：完成升华获得圣痕；灵魂能力另经伟业觉醒（见「晋升方式」），开局不可获得。
  - 源质蜕变：吸收源质、以源质淬炼（槐诗"阳生"将对手源质/灵魂/圣痕转化为暗影再逆向淬炼）。
  - 进阶仪式：各圣痕进阶有特殊条件（洛基=让所有人信以为真的谎言、小红帽=击杀狼类、睡美人=长睡、寇斯切=正面击溃、永恒之路=大量物质加装、东君=先铸天阙）。
  - 修正值/歪曲度：以行为改变世界轨迹换取，五阶成长必需品。
  - 大群与信仰回馈：庇护大群/领地获得信仰与愿力（槐诗三阶大司命即因丹波混种信仰回馈）。
  - 事象升华：事象层面改写（人造人→真人、怀纸素子燃烧自我达成仅限一次的神迹）。
  - 源质武装/威权：以情感铸武装、以神性成威权；神降馈赠（巴德尔"神性升华·光"）。
  - 神迹刻印：以典籍/刻印承载神迹（国殇可将大群圣痕全部拔升一阶）。
  - 圣痕融合与重铸：鸦群与怨憎融合、赫利俄斯重铸（愤怒化身、悲伤化身等）。
  - 受祝仪式/换路：英灵由阴魂受祝进阶、乐园之路传承、吸收他人圣痕临战蜕变。
  - 圣痕尽弃重铸现境之太阳（终局例）：献出全部圣痕与神之楔、焚尽命运之书，汇聚五大谱系之力重铸太阳。
