位置: 太阳系轨道运行的宇宙空间站（奥林匹斯的太阳威权遗物），每隔七十一年与地球轨道交错；后期抛锚于木星"恶魔之眼"（大红斑）正上方同步轨道。
外观: 十大工坊之一、最古老炼金工房；损坏九成后自我修复，抛撒邀请函招炼金术师上门"修水管"；开普勒基地在月面；赫菲斯托斯之间（核心区保存库，存回光结晶等宝物，加兰德翁将权限凭证炼成钥匙赠槐诗）。
功能: 神前对决（混沌时代秘仪、神性点数规则）舞台；普布留斯以战车化为地狱为代价萃取神性"造神"；如今本身就是一个巨型炼成釜。
历史: 被彤姬【事象修订】化为碟形世界（黄昏之乡降临）；巴德尔陨落、槐诗获神性升华·光；最终被掏空，遗骸滞留木星轨道，新象征为【毁灭要素·阿波菲斯】。
危险度: 4（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
