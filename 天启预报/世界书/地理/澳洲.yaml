位置: 现境南半球大陆；整个澳洲大陆为查拉图斯特拉密仪的缓冲区。
场景: 堪培拉（澳洲首都、沙王都城，宴请槐诗并赠南极船票处）、达尔文（北部港口，核战废土、全城被大公司垄断、物价疯狂，乌鸦道破槐诗原命格"万将功成一骨枯"处）、昆士兰海湾（澳洲三分之一土地沉海形成的辐射区）。
功能: 核战废土（八九千万吨当量核爆、四十年沙漠化侵蚀六成耕地）；存续院总部隐于此，以架空技术同存现境、边境与深渊；沙王以黄金琥珀令五分之一个澳洲重获新生。
历史: 沙王在堪培拉宴请槐诗；诸界之战后象牙之塔校区迁往澳洲重建。
谱系: 无
危险度: 2（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
