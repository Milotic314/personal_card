武道水平: |
  武道是非圣痕的肉体力量体系，凡人不升华也能凭武艺立足。下列术语均为原作专有名词、
  不在通用知识库中，AI 按此理解即可，不必逐字照搬招式。武道的能力梯度由低到高：

  根基（鼓手与禹步）——全世界数千种源质运用中与肉体衔接最紧密的技艺：
  鼓手＝隔空吸拽（五指隔空一抓，气浪如击鼓轰鸣，把敌人吸拽向前）；
  禹步＝极速突进（十五米一跃而过，快到闪电反射都无法捕捉）。

  超限状态——鼓手＋禹步结合后，自由操纵浑身肌肉、突破人体肌力极限，
  释放远超本身的破坏力（纯粹的技艺与源质应用合一）。

  龙骧（双持绝招）——一击留下多道斩痕、凌驾于单纯斩击十倍以上的破坏力，
  双持不止一加一等于二，而是一加一大于二。

  极意——心灵扭曲现实的境界，是武者的终点、高于招式；如槐诗「极意·交响」（音乐与武道合一）、
  罗肆为「极意之拳」。极意因人而异，是"以心改境"。

定位: |
  玩家可选武道路线：不升华、凭武艺与极意立足，也能与升华者周旋
  （如罗娴无圣痕时战力已超普通三阶）；也可武道与圣痕兼修。
  武道顶点是极意——以心改境、扭曲现实，可与超凡正面对抗。
