# 提及级速查：一句话｜谱系｜危险度1-5（4高危/5致命）
地点速查:
  羊州: 东夏城市（原文仅提及，与燕京金陵并列）｜谱系：东夏现境｜危险1
  维也纳: 欧洲音乐之都，槐诗梦想考音乐大学当大提琴手｜谱系：现境·欧洲｜危险1
  黄石公园: 槐诗与莉莉重逢同游处（万象天球架空分支）｜谱系：现境·美洲｜危险1
  巴格达: 天敌青颈盛怒搅拌乳海倒灌之处｜谱系：现境·中东｜危险3
  曼彻斯特: 被归净之民毁灭的城市｜谱系：现境·欧洲｜危险3
  玄武湖旁酒店: 绿日弃子藏身处，原暗小队五秒全灭萧祁等六人｜谱系：东夏·金陵｜危险2
  费尔巴哈公馆: 四年前恶性诅咒事件发生地（柳东黎受诅咒，天文会掩盖）｜谱系：现境｜危险2
  稷下学宫: 四种传承（炼丹铸剑奇物天工阴阳变化）源自神明时代，稷下四杰种树｜谱系：东夏谱系｜危险2
  文王灵囿: 东夏地卡（鹿蜀经营），生机死意循环的自然；孕育神迹刻印·扶桑｜谱系：东夏谱系·地卡｜危险3
  安房国: 里见氏领地，琥珀为安房国之王｜谱系：瀛洲·里见氏｜危险2
  宇治宝藏: 京都平等院，瀛洲谱系宝库；藏酒吞童子等四具大妖怪残骸｜谱系：瀛洲谱系｜危险4
  三途: 黄泉比良坂六百年厨魔名店，主厨深津庆被介错杀人魔断头杀害｜谱系：瀛洲·黄泉比良坂｜危险2
  高野山: 真言宗圣地，怨僧（圣痕·土蜘蛛）来处｜谱系：瀛洲｜危险3
  暴虐之海: 高悬于亚洲边境之上的海，巨鹅集团巨轮横渡至邪马台｜谱系：边境｜危险3
  五月花号: 白冠王黑船（伪装现代游轮），仅一名乘客能特赦抵达新大陆｜谱系：边境·白冠王｜危险5
  镜界: 倒影与正体对应的世界，归净之民饲养边境异种的笼子｜谱系：异空间·归净之民｜危险5
  龙三角: 邪马台帝国遗迹边境，界楔被打坏后漂移中，瀛洲两系争夺｜谱系：边境·瀛洲两系｜危险4
  奥里西斯: 群星号前身，天国谱系五阶要塞级兵器（已死，残骸沦为列车）｜谱系：天国谱系·理想国｜危险5
  密特拉空间站（密涅瓦IV）: 罗马环月轨道太空研究基地，遭小行星群冲击受损｜谱系：天外·罗马｜危险3
  赫菲斯托斯之间: 赫利俄斯核心区保存库，存放回光结晶等宝物｜谱系：天外·赫利俄斯｜危险3
  木星·恶魔之眼: 木星大红斑风暴气旋，如深渊望向现境的眼瞳｜谱系：天外·木星｜危险5
  空中庭院·赛维鲁斯: 罗马皇帝传世行宫，悬浮对流层，无武装纯炫耀｜谱系：罗马｜危险1
  永冻炉心: 黄昏之乡总控中枢，铸造熔炉（十三个分控中心），被槐诗灭绝｜谱系：地狱·黄昏之乡｜危险5
  天狱堡垒·荷鲁斯: 深度移动都市型堡垒，彤姬借其骨架维持黄昏之乡｜谱系：地狱·象牙之塔系｜危险4
  太一院: 象牙之塔炼金设备管理中心，最高支持17级人造深度｜谱系：象牙之塔｜危险3
  追知者园区: 象牙之塔内边境灵地别墅区，石髓馆空投至此｜谱系：象牙之塔｜危险2
  大图书馆: 象牙之塔内，黑神维塔利归来重逢处；与无何有之乡大图书馆同名｜谱系：象牙之塔｜危险2
  中西伯利亚贝加尔山脉: 天国谱系老牧羊人（顶尖炼金术师）所在｜谱系：现境·俄联｜危险3
  檀香山: 夏威夷群岛（罗马殖民地），领取白鸠卡特遗赠铁箱处｜谱系：现境·罗马殖民地｜危险1
  格陵兰: 现境北部通向地狱的三大封锁出口之一，槐诗截杀陆白砚处｜谱系：现境·边境封锁｜危险4
  冰岛小镇: 陆白砚被流放三十年之地，杀尽小镇凭《国殇》玉冠重生｜谱系：现境·北欧｜危险3
  灰岸: 中介边境路口，良宵会主祭莫兰多·蓝度上车处，灰衣人警告勿往｜谱系：边境｜危险3
