诸神时代: |
  诸神为摆脱天命互相征战、无人善终，约公元1650年前后集体陨落，神性汇聚成毁灭要素之首"牧场主"。
  东夏诸神之主帝夋（后为彤姬）为挣脱天命铸造彤弓素矰、射落举世烈日（九支帝夋之箭用尽），最终被凡人羿自不周山射出的第十支箭贯穿陨落；
  神明之死与太一陨落导致地狱衍生，神明尽数归入龙脉，帝夋之友化身三大支柱庇佑现境。

灭世循环: 地球被多次"灭世计划"废弃：序章（公元2020年，珠穆朗玛）即"国际天文会第十四次灭世计划"，旧盖亚·地球Ⅷ湮灭。现境建立在一次次灭世与重生之上。

关键节点:
  - 四百年前：无厌之匣被东夏谱系封印于魔都之下。
  - 公元1620年：白冠王掀起大移民，美洲谱系创立；同节点莉莉之死。
  - 公元1740年：圣灵谱系分裂，工业革命盛行。
  - 公元1930年：国际天文会成立。
  - 公元1950年：理想国分裂，黄金黎明叛逃地狱、天国陨落、绿日成立。
  - 此后：再生计划（统辖局内战，胜者叶戈尔）；费尔巴哈公馆事件（牧场主降临疑似）。

正传: 公元2110年：命运之书在新海激活，槐诗入局（正传开始）。2110-2113年：新海觉醒、魔都阴谋、KP暗网、厨魔大赛、邪马台、魔女之夜、群星号、少司命进阶、象牙之塔、黄昏之乡、瀛洲里见家、丹波内圈、赫利俄斯、天国谱系重建、地狱哨站、深渊之赌、诸界之战。

终局: 吹笛人以自身死亡完成献祭，促成毁灭要素·统辖局诞生；槐诗重铸现境之太阳、成就天敌·太一；天国计划（释放二十四毁灭要素、92%表决通过、彩虹桥时间跳跃）开启新纪元；
  槐诗作为唯一观测者（见证者）留守旧世界四十五万年，以见证者特权拆出七条时间线，世界线归一，新世（新世历）开始。
