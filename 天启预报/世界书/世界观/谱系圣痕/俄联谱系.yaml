谱系: 俄联谱系（圣灵谱系分裂后的产物，奉迎虚无神明创立正教谱系，源典《圣典》，军备第一；天敌弥赛亚/撒旦叶）
代表圣痕:
  - 弥赛亚（五阶）：经《圣典》创造出的圣灵｜俄联与圣灵谱系共有之名
  - 撒旦叶（五阶）：经《圣典》创造出的恶灵，与弥赛亚同体｜七大天敌之一
  - 智天使（五阶）：经《圣典》创造出的圣灵｜基路伯
  - 座天使（五阶）：经《圣典》创造出的圣灵｜托罗努斯
  - 神之岩（五阶）：俄联五阶圣痕｜圣灵图雷尔
  - 霜父（四阶）：斯拉夫暴风雪之神、凛冬之王，寒冰雪与冻结荒芜的主宰｜弗拉基米尔曾短暂化身
  - 夜魇（四阶）：塔克辛的进阶
  - 塔克辛（三阶）：墓碑学派圣痕，活死人半尸体质+消融隐身，隐身对摄像机无效｜红手套原圣痕
  - 食人魔（三阶）：吞食生命为生的灾厄巨妖，食人可得知性与智慧｜弗拉基米尔/瓦利亚
