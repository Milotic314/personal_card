至福乐土: |
  地狱侧的乐土，牧场主的领域。东夏升华者大队曾突入的战场；
  归净之民的根据地，实为牧场主的"餐盘"；终局含福音圣座升变天之上的第八层（胃液之海）。
  被天狱堡垒砸碎、牧场主在此被"太牢"烹杀。
雷霆之海: |
  覆盖数十个深度的地狱汪洋，侏儒（巨人之裔）为霸主。统治者中的统治者·雷霆大君
  （与马库斯订立深渊之赌）居于此；"举万成一"（牺牲万人成全一人的灾厄）为其灾厄；
  槐诗终局以纯白之箭贯穿大君，成为新一代大君与深渊至强。
地狱侧总行动: |
  诸王与弄臣各怀鬼胎；赫笛誓要"搞死槐诗"；为诸界之战积蓄兵力。
  行动循环: 廷议密谋、军团调遣（毁灭巨像或黑死军团）、围剿或试探、失败则加码。
  默认路径: 诸界之战全面爆发；雷霆大君终局被槐诗斩杀；吹笛人湮灭。
危险度: 5（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
