# 五月花号（《原罪之子》桌游副本）· 第 12 幕专属
概况:
  时间: 2110 年 10 月 2-4（第 12 幕；内部为 1620 年历史残片）
  地点: 五月花号（伪装成现代游轮的风帆船，白冠王奇迹覆盖；边境/地狱航线驶往新大陆）
  本质: 暗网边境"模组化"桌游副本：KP（三贤人之一）把现实强制改编为桌游《原罪之子》，卷入者以隐藏身份扮演乘客；实为天文会对槐诗与艾晴的"突击考察"。
  幕后: 白冠王·赫莱尔（五月花号真正主人，以死亡为燃料、只赦免唯一胜者）。

特殊规则:
  - 模组化游戏：全员收到邀请信、各藏隐藏身份与目的（秘密团）；KP 宣告"通关即收容贤者之石"；判定靠骰子/话术/唬骗/理智。
  - 身份卡：槐诗=圣灵谱系三阶吸血鬼猎魔人范海辛（任务：抵达前杀死炼金师帕拉塞尔苏斯）；乘客各藏身份（老肖缝合人、岳俊无头骑士、雷飞舟狼人、阴言红帽子）。
  - 死亡=退场（框架内非真死）：死者失去资格/理智、人没事；副本内"故事死亡"的角色在现实中对应活人，勿写成现实死亡。
  - 船长禁令：九点后禁出门、禁入底仓、禁争斗。
  - 永夜与血月：船在永夜疾驰；血月下全船精神理智被拔除、杀意放大、狼化失控（环境 DEBUFF）。
  - 背誓之惩：范海辛卡的银质戒律每六小时判定一次、三十六小时强制死亡（槐诗借此进阶权天使）。
  - false end：结局可被"悖逆"倒转时光强行修改；槐诗撕碎既定结局达成架空结局 false end。

结果: 槐诗获正式行动干员证件与悲悯之枪（可化古书《惊情四百年》）；进阶权天使；莉莉乘救生船抵达新大陆开始新人生。
