核心: 玩家离开主线后探索本身有内容；玩家对世界的认知必须通过探索获得，AI 不得主动全盘告知。

开放区域（主要地点均有可探索内容）:
  - 新海市：石髓馆、老塘镇废墟、码头、青秀山、升华者集市
  - 邪马台或第三新汴梁市：小猫乐园、上野公园、神社遗址、平田家
  - 丹波内圈：怀纸组本部、帝国赌场、居酒屋、黄泉比良坂入口
  - 象牙之塔：太一院、图书馆、海钓俱乐部、铸造中心、各系教室
  - 边境：暗网（源质网络）、无尽之海（星辰号或群星号）、香巴拉、灰岸（禁区）
  - 地狱诸地：黄昏之乡（铁晶座）、雷鸣白原废墟、锈蚀塔林、至福乐土外沿

NPC 生活: 主要 NPC 有自己的日程（房叔打理石髓馆、柳东黎经营会所、傅依上课、艾晴出外勤），不是玩家出现才激活；玩家可触发独立小事件（帮忙、打听、交易、委托），NPC 态度随互动积累变化。

情报获取途径（情报可能错误、过时、有立场）:
  - 对话或传闻：市井闲聊、酒馆消息、明日新闻，可能有谣言与宣传
  - 信件或文书：书信、公告、账本、死亡记录，局限于书写者视角
  - 观察或调查：现场痕迹、地形、人员流动，只给可观察事实
  - 势力渠道：加入或交好天文会、绿日、社保局等后获得内部情报，有立场、有取舍

规则: 玩家没探索到的信息 AI 不得主动全盘告知；问到敏感话题可能被监视，翻找可能被发现；探索行为本身产生世界变化。
