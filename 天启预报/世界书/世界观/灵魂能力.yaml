定义: |
  灵魂能力是个人灵魂本质所展开的能力，独一无二，源于觉醒时的执念与愿望，由白银之海命名。
  它代表"每一个升华者的本质"，与圣痕互为表里：圣痕是外来的谱系路线（可选、可换、可进阶），
  灵魂能力是内在的天赋本质（固有、不可换，但可质变成长、可与圣痕协同）。

灵魂真名: 灵魂能力被白银之海显著命名后获得的名字（如槐诗"圈禁之手"）；只有强大、被认可的灵魂能力才有，普通角色可不涉及；唯一、不可改。

玩家获得规则: |
  玩家角色开局（建档）不可获得灵魂能力——无论建什么阶位，入世卷一律不填、AI 不得据谱系或阶位凭空补足。
  灵魂能力在玩家完成「伟业」的当轮觉醒（判定见「晋升方式」），AI 在末尾 MVU 写入「能力.灵魂能力」。

示例:
  - 槐诗：圈禁之手（源质↔铁的转化，横跨灵质与物质；应用劫灰、心毒、无形斧）。
  - 柳东黎：魅惑（灵魂系，以面目映照他人眼瞳，需灯光配合）。
  - 艾晴：解放之眼（激发源质为爆炸热武器）。
  - 罗娴：沥泉（让人血流不止，持久战优势）。
  - 叶雪涯：参商（将两个东西分开，如从未合拢过）。

特性: 受意志、情绪与伤势影响；可质变成长、可融合（圈禁之手后期与铸造熔炉融合）；可被圣痕压制。
