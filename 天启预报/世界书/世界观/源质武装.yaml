定义: 以灵魂、情感与源质铸成的武装，与持有者灵魂相连，随情绪与状态变化形态。

槐诗的主要武装:
  - 愤怒之斧：七载愤怒杀意铸成，遭攻击受精神冲击。
  - 悲伤之索：丧亲之痛凝聚，束缚令其心灰意懒。
  - 悲悯之枪：银十字枪，嵌青冠龙贤者之石，可变古书《惊情四百年》。
  - 苦痛之锤：魂灵苦难见证，锤头可射等离子烈焰。
  - 御神刀·怨憎：活刀，砍中唤醒死亡渴望、吞吃源质乃至圣痕，刃长可伸缩。
  - 美德之剑：白马王子遗留，可召白马放"破晓之剑"。
  - 悔恨之锏·阿房：以悔恨铸就，重量视同石髓馆。
  - 军团之拳、纯白之弓（告白之箭/爱之箭矢）。

特性: 可被重铸、融合（如愤怒化身、贝希摩斯）；重铸为"灵魂武装或化身"。
