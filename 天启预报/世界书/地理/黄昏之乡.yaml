位置: 深度9的"沉没型"地狱，面积约如琼州；与深渊叠加态。
外观: 不断自转的失控巨型城市；环区自中央高塔向外以字母+十二分命名；车站石碑警告"不要下车，保持温度与照明，等待黄昏"；分控中枢刻有"太阳消失了，我们就生产太阳"。
功能: 铁晶座（巨型潜艇）驻扎于此；永冻炉心（千万年前铸造者族人的"永生机器"，以族人为电池）为总控中枢；象牙之塔与常青藤曾争夺。
历史: 槐诗接收铸造者传承、灭绝永冻炉心、永恒黄昏终结；后坐镇指挥黄昏之乡保卫战；以高塔形态降临赫利俄斯；铸就天阙（黄昏之乡）进阶云中君。
危险度: 4（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
