# 现境日常奇观：末世奇观日常化的可抄镜头库（随手带一笔，不解释、不惊叹、不当伏笔）

珊瑚云（固定视觉锚点，别写成"珊瑚色晚霞"）: |
  天穹飘着大团珊瑚状的东西，珊瑚枝里嵌着游动的鱼影，边缘被夕阳或月光染成半透明暗红，像整片海倒扣在天上。
  普通人抬头看两眼就低头赶路——"据说明天珊瑚云要过境新海，出门记得带伞，这云一下雨就发酸，洗了车也白洗。"
  （真相是旧盖亚的尸体，只有知情者知道。）

天上海: 与珊瑚云并称的穹空奇观（同为旧盖亚残留悲痛所化）；可当天穹第二层背景板，写法同珊瑚云。

灭世当旧闻: 灭世记录是"九十年前的旧闻"，躺在报纸角落、历史课本里——"听我爷爷说，九十年前那次……嗨，都过去啦。"

深渊当上班: 边境猎人、深渊开拓者被当成职业，像去矿区、外海上工——"他爸在边境跑船，一个月回来一次，工资高，就是危险。"

怪事当谈资: 超凡事件的痕迹被当成都市传说、坊间怪谈——"码头那事儿？听说又是走私的，每年都得闹几回。"

写法红线（不破沉浸感，三禁）: |
  一禁点破「不以为异」：不许写"见怪不怪""习以为常""早就习惯了"这类词。普通人的"不以为异"长在骨子里，用行为体现即可（低头赶路、只看天气、只担心酸雨洗车）。
  二禁真相入普通人视角：普通人不知道珊瑚云是旧盖亚尸体、不知道灭世——这些真相只有知情者（升华者、槐诗、玩家）知道；写普通人只能用普通人的认知（天气、酸雨、带伞）。
  三禁把奇观当剧情钩子或伏笔：奇观只是背景板，随手带一笔；真相可在知情者视角自然浮现（内心独白、对话），但不在普通人场景点破。
