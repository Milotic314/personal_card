政治与权力结构:
  核心统治机构:
   - 天文会（国际天文会）: 现境维护者与秩序化身，联合国暗面，横跨现境/边境/地狱的最高管理机构。
     三大机构——统辖局（中央决策，十人委员会颁布十二铜表法，秘书长叶戈尔）、存续院（收容毁灭要素、降低歪曲度，本体是"活的建筑"）、理想国（天国谱系前身，已解散，幸存者散落为象牙之塔等）。
  五常与六大谱系（五常各把持一谱系、各拥一位天敌）:
   - 东夏共和国: 东夏谱系（十八条路、绝地天通龙脉）；社保局（局长玄鸟，高层符残光/白帝子/叶雪涯）＋特事处（地方执法，升华者犯罪罪加一等）。
   - 罗马: 罗马谱系（万神殿体系），法王厅主导，皇帝提图斯六世。
   - 俄联: 俄联谱系（正教、军备第一），大教宗统领，圣棺网络遍布。
   - 美洲共同体: 美洲谱系（印加、底蕴不足），赖存世神明白冠王支撑，当代谱系之主羽蛇。
   - 埃及第一王朝: 埃及谱系，法老王阿蒙霍特普，天敌阿赫（最古老）。
   - 天竺: 世界第六强国，谱系一分为三（毁灭/创造/维持）内斗四百年，六大中最薄弱。
   - 瀛洲: 化物谱系；鹿鸣馆（公家）、"座"（隐秘机构把持"能"系圣痕）、将军幕府（武家，将军道格拉斯·亚瑟）。
  学术与执行机构:
   - 象牙之塔: 天国谱系重建后的学术/管理核心（八面体移动边境），校长罗素（真身洛基）；下属太一院（院长彤姬）、铁晶座（米哈伊尔大宗师）、丹波分校（槐诗管理）。
  地狱与敌对势力:
   - 绿日: 反现境地狱势力，大统领佩伦（赫锑王），十灾。
   - 黄金黎明: 理想国分裂产物、凝固者集团，觊觎源典·命运之书，三大创造者玛瑟斯/伍德曼/维斯考特。
   - 归净之民: 毁灭要素·牧场主的崇拜势力，推进魔都通路。
   - 良宵会: 腐梦女皇崇拜组织，主祭莫兰多·蓝度。
   - 牧场主（毁灭要素之首）: 诸神死后于地狱的倒影，目的是吞食现境，旗下归净之民与至福乐土。
  其他势力:
   - 石釜学会: 现境最大炼金术师组织，垄断炼金术与银血药剂认证，颁发"大宗师"头衔。
   - 三贤人/暗网: 理想国事象管理者（DM/KP/ST），暗网的真面目。
   - 万孽之集: 超大型非法悬赏/交易平台（"滴滴打人"）。
   - 无归者墓地: 松散地狱开拓者大联盟（人才市场/交易平台）。
   - 先导会: 天文会前身学者组织，正体为缄默者石碑（白银之海运算装置）。
