位置: 现境东亚，与东夏隔海；瀛洲谱系（化物谱系）所在地。
场景: 京都（古都·黄泉比良坂关联）、奈良（里见家本家·御前厨魔试合）、天狗山（大天狗）、上泉道场（剑圣）、馆山（港口重镇）、黄泉比良坂（混种聚集区）、邪马台（新秀赛地狱，后注册为东夏第三新汴梁市）。
势力: 鹿鸣馆（华族公卿会议·上皇体系）、座（朝廷隐秘机构·服部天狗·把持"能"系圣痕）、将军幕府（鬼公方·道格拉斯·亚瑟）、上皇（十四岁·以里见琥珀为桥与东夏结盟）、里见氏（八犬士·安房国守护）。
圣痕: 化物谱系"能"系：日巫（卑弥呼）、鸦天狗、百目鬼、建御雷神、般若、木魅、飞缘魔、鵺、山姥、茨木童子等。
