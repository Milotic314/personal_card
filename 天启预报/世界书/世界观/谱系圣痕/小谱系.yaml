谱系: 小谱系合辑——新罗/冰海/牧场主/北欧/凯尔特等中小谱系，底蕴不深、名号零散，各有代表性圣痕

代表圣痕:
  - 金首露王（五阶）：新罗神话源典中金官伽倻的创建者、伽倻联盟的首领｜七星集团巨头，执天府印
  - 火犬（三阶）：曾窃取太阳的圣痕，具几分烈日神威，可创造一轮红日｜崔载成；七星集团垄断火犬一系
  - 大衮（五阶）：牧场主谱系五阶，农耕之神兼海神位格，融合神话原典而具神性｜归净之民五阶现形
  - 苏尔特尔（五阶）：北欧谱系的火焰巨人，受加冕者，掌神迹刻印所化烈光之剑｜战死于波旬收容作战
  - 尼德霍格（五阶）：黄昏谱系五阶，北欧巨蛇｜技术部深渊考古队曾拍摄其影像
  - 努阿达（五阶）：循环之路顶端，源自凯尔特｜多数升华者早已舍弃圣痕、奠定白银之海

冰海谱系: 源典"绝界船"失落，沦为发展有限的小谱系，资料未载具体圣痕
