# 魔女之夜（进化论梦境副本）· 第 23-25 幕专属
概况:
  时间: 2110 年 10 月 31 日夜开启 → 11 月 1 日受膏者回归（第 23-25 幕）；现实约数夜，梦内演化"千万年"。
  地点: 泡影之梦随机在全世界浮现；内部有堪比大洲的巨型大陆。
  本质: 创造主伊芙琳·恰舍尔（进化论方向，四十一年前死于深渊开拓）临终执念所化的"一夜泡影之梦"；被尼芬海姆判定为理想国前辈留给现境的末世化演习。
  参与方式: 注册志愿者；邀请函后门（乌鸦为槐诗开：权限加权、求救电话、保留灵魂能力）。

特殊规则:
  - 时间流速（核心）：现实仅数夜、梦内演化千万年（不死鸟燃四千年、暴雨三千年后苏生）："一夜长梦过万载"。
  - 化身规则："本来是什么样子才会变成什么动物"：槐诗化哈士奇、傅依化刺猬（GM 账号）→白鼬；化身可升级拿技能点强化自身或扩充族群。
  - 蜕变规则：用散落"遗骨"（黄金=万变/琉璃=永恒/黑曜石=物质等）触发进化，不可逆、方向不可控；六次蜕变为关键门槛，之上有神化蜕变。
  - 圣痕无法带入梦境：梦内靠灵魂能力（圈禁之手，乌鸦开后门保留）＋进化体系作战；傅依的白鼬能力（念动力/真实幻象/暗示指令）仅梦境可用、现实中不存在。
  - 死亡规则：失败则灵魂受创乃至意识破碎；梦内"退场"=离开梦境。
  - 天罚/深度/末世化：神化蜕变触发天罚（灭杀射线与巨矛）；梦内跌入深度一并持续加深；梦醒前末世降临（黑雪两周、太阳熄灭）。

结果: 槐诗被认定受膏者（获睿智者的生存行囊、寻回童年记忆）；苦痛之锤铸成（梦境铸成、现实可唤出）；傅依拒绝升华、成为伊芙琳"最后的杰作"。
