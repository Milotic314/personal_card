厨魔体系（绿灯详表）:
  定义: 以极致口腹之欲深入深渊地狱的料理人，精髓＝爆发；比谁做得更难吃。厨魔是独立职业体系，与升华者阶位并列、可叠加（如弗拉基米尔＝三阶圣痕食人魔＋肌肉厨魔）；纯厨魔（如郭守缺）无升华位阶，战力在祭祀/诅咒料理。
  等级链: 白板  一星  二星  三星    九星（顶点称"厨魔之巅"）。黑卡＝正式厨魔门槛。
  星级含义: 一星＝独当一面、出师赚钱；二星＝名店大将；三星＝自成流派；再向上＝公卿低头、大夫礼敬；最终＝厨魔之巅。星级之间有决定性差距，越级挑战会出事。
  升星: 由厨魔协会/地狱厨魔赛事委员会依"战绩＋贡献＋潜力"评定，无量化分数线。战绩（厨魔大赛/御前厨魔试合/厨魔指定）、贡献（如主持《吃了吗》副刊弘扬地狱饮食）、开拓（如至福乐土登陆战）均可升星。
  黑卡福利: 现境/边境/地狱无偿租借厨房；定点开张自动获"饥饿之口"认证；大部分地狱餐厅免费用餐。
  赛事: 厨魔大赛（弃赛会被评委诅咒"一辈子吃狗屎味咖喱"）；御前厨魔试合＝双方互为评判、互相做菜给对方吃，直到一方吃不下/吃死/同归于尽；厨魔指定＝赛事委员会指名对决。
  代表: 槐诗（现境最年轻六星厨魔、裁判资格取得者、星级考察员，被誉为未来九星）；郭守缺（纯厨魔、易牙传人/当代易牙，无星级标注）；深津庆（二星）；七星安德森。九星参照：东夏易牙食魔、北欧金宫之主、埃及汤釜婆婆。
  铁律: 厨魔星级与升华者位阶两栏分开写，禁止互相污染；纯厨魔不写升华位阶；高位恩怨用厨魔指定/御前试合解决，别写成单纯打架；九星天花板极稀缺，自创角色勿轻易登顶。
  触发词: 厨魔、厨艺、料理、黑卡、厨魔大赛、御前试合、深渊厨魔、比谁做得更难吃。
