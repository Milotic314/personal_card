源质: 组成灵魂的物质，可吸收、点燃，用于炼金、进阶与续命。
灵魂: 衡量常人与升华者的界限；本性与意识的升华。
白银之海: 赋予全人类共有灵魂的源泉（理想国第三工程），核心由所有人类源质投影汇聚；升华者须让"铁石本性穿过白银之海，升华为黄金之魂"。
升华者与学者: 升华者穿过白银之海完成升华、凭圣痕行使超凡之力；学者以知识与秘仪改变现实。
圣痕与阶位: 升华者的力量烙印与等级体系（应激期、水银、黄金、以太、星锑、贤者之石、天敌）；见「圣痕与谱系」。
天敌: 突破极限成为"行走在人间的神明、人形的地狱"的规格外位阶；现存仅七位（褚海·兵主、羽蛇、青颈·湿婆、阿赫、弥赛亚/撒旦叶、卢基娅/卢基乌斯）。
三大封锁: 查拉图·斯特拉如是说（物理规则秘仪）、万物终亡（死亡概念）、彩虹桥（现境与边境统和）；见「理想国工程与三大封锁」。
毁灭要素: 二十四个、两两相对，完成前提即必能毁灭现境；见「毁灭要素」。
命运之书: 天国谱系源典与目录，槐诗命运的枢纽。
修正值与歪曲度: 五阶改变世界产生的偏差评定（合称"偏差值"），有利为修正值、反之为歪曲度，分开计算、不中和。
凝固者与侵蚀体: 拥抱地狱的堕落者与畸变源质滋生的怪物；见「凝固者与侵蚀体」。
边境遗物: 来自边境与地狱的特殊物品，能力各异；见「边境遗物与神迹刻印」。
混种: 兽化特征者（局部或全身动物化），多聚集丹波内圈与瀛洲；受血脉病变困扰，常被现境排斥。
边境遗民: 长期生活边境过渡地带，身份不被任何一国承认；多从事边境贸易、开拓或佣兵。
存世余孽: 旧世界破灭后从深渊之底诞生的灾难结晶，拥有近乎无限成长潜力，放任可能成长为毁灭要素（如腐梦与牧场主子嗣）。
存世神明: 现境仅存三位（其一生死不知、存续院内藏一位、美洲勉强撑局一位）；天国谱系亦拥有（罗素："现在，有两个了"）。
模因: 观念或信息层面的侵蚀单元（伍德曼以模因传播），可用对应神迹刻印清除。
事象记录/事象精魄: 理想国三贤人系统（DM/KP/ST，暗网真面目）专精事象记录复原与修订。
源典: 谱系根源典籍（《命运之书》《丹青卷》《往世书》《圣典》《阿维斯陀》《山海经》+龙脉）。
灵魂能力: 个人灵魂本质展开的独特能力，源于执念/愿望、由白银之海命名；玩家开局不可获得、伟业后觉醒；见「灵魂能力」。
灵魂真名: 灵魂能力被显著命名后获得（槐诗"圈禁之手"）；本质唯一不可改。
圣名: 纯血家族血脉传承的名号或能力（如原家"传家碧血／一骑万乘／我心如铁"）。
龙脉: 东夏源典——绝地天通后龙神神性化的国脉；东夏谱系与守护者皆系于此。
天命: 受加冕者或五阶圣痕传承的"天命"（大司命=收割死亡、海姆达尔=军略远见）；非设常、符合条件才出现。
神髓: 现境三柱之一（源质之柱投影白银之海、神髓之柱具现天国、变化之柱支撑三大封锁）。
大群与大群之主: 地狱侧军团单位与统率者（见「大群之主与军团」）；授名者＝被深渊认可、有正式名号的大群之主。
神之楔与圣骸: 神明死后遗留的唯一权柄（通往天敌之路）／五阶死后追认的残骸。
