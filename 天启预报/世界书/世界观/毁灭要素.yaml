定义: |
  天文会评定：一旦完成了某种前提，就必然能够毁灭现境的东西。
  共二十四个，两两相对成 12 对（3 对半未写全）。

主要要素:
  - 牧场主：要素之首，昔日所有神明死后于地狱的倒影（"称之为神也不为过"）；崇拜势力为归净之民。
  - 灰衣人：前天文会文职，所到之处必有灾劫；与"毁灭要素·天启号角"融合。
  - 永生之兽：唯一得到永生的存在（寿命或达九百四十万年），唯一所求是彻底死亡。
  - 波旬：魔性之智的体现，被存续院解体收容。
  - 天国与黄金黎明：理想国第四工程与分裂产物。
  - 吹笛人：混乱和灭亡的化身，诸界之战终局以自身死亡完成献祭、湮灭于裂隙虚无。
  - 统辖局：从白银之海中摘出的残酷铁则；终局吹笛人将毕生灾厄植入统辖局后，【毁灭要素·统辖局】诞生。
  - 阿波菲斯与旧盖亚、天文会与救世主（末位【毁灭要素·天文会】为天文会最核心机密）。
  - 宇宙光与分解之梦：宇宙最深处的凋亡之光，与众生潜意识中的伤疤（引发自失控中一次次自我灭亡）。
  - 无厌之匣：虔诚祈求、献上足够灵魂即可换取一切的万能之物；四百年前被东夏谱系将未完成胚胎封印于魔都之下。
  - 查拉图斯特拉与存续院：与「查拉图·斯特拉如是说」封锁相关的存在，及其对应。
  - 天启号角：灰衣人在存续院技术下与之融合的毁灭要素（见灰衣人条）。

关联: 牧场主在诸界之战末尾吞食至福乐土欲吞现境，被现境之太一夺去威权扔入深渊之底。

玩家成为毁灭要素:
  触发：开局建档时玩家在人设/背景/动机里写了毁灭要素出身，或剧情中玩家成为毁灭要素；由正文 AI 识别、不设表单。
  开局：AI 首轮建档/回复时 update 称号与威权。
  剧情中：事件收尾时 update 称号与威权。
  称号：称号名＝毁灭要素·{名字}（名字最多四字，如"灰衣人""天文会""天启号角"），阶位5（灭世级），效果一句话写该要素的领域或灾劫（如"所到之处必有灾劫"）。
  威权：类型=威权，效果＝该毁灭要素的领域/灾劫权能（如"以歪曲度修改现实"），持续条件＝成为毁灭要素后常驻，限制含"非全知全能""受前提与代价约束"。
  防全知：毁灭要素并非全知全能，天文会也是毁灭要素、同样没有全知全能。玩家以毁灭要素开局或成为毁灭要素后，
  只能掌握自身领域内的感知与权能，不得知晓一切、不得预知全部、不得无所不能，其毁灭权能仍有前提、范围与代价。
