位置: 现境，美洲城邦联合成员；看守者监守自盗理想国战略储备后兴建的欲望之城。
场景: 被清空迎接的机场、赌场联盟总部（首领道格拉斯的军事基地金库，藏一千三百吨黄金、二百一十吨源质结晶、四百吨净金与美洲银行金库钥匙）。
功能: 商业同盟（六家联盟）之城；七十年前看守者监守自盗理想国战略储备、投资兴建出这座"泡影之城"；罗素带槐诗来此追讨被吞没的理想国资产。
历史: 道格拉斯以金库资产双倍奉还求和遭拒；槐诗以"太阳历石""永生机器"秘辛为筹码、以铸造者技术合作换取美洲谱系下注，拉斯维加斯向天国谱系宣誓忠诚。
谱系: 无
危险度: 3（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
