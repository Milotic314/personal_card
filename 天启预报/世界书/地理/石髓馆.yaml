位置: 新海青秀山附近地脉上的宅邸（新海十大鬼宅榜第一）。
外观: 老宅庭院，馆灵房叔打理（第9幕前房叔无实体、只余闹鬼现象，不得实体登场）；随灵棺修复化为可搬迁的边境性质灵地。
闹鬼现象（第9幕前房叔无实体时的表现）: 门吱呀自开、烛火无风摇曳、碗碟轻轻移位、管风琴偶尔自鸣：只有"物动"，绝无老人形貌或人声（此时房叔无法沟通）。
功能: 槐诗的家与心灵锚点；房叔管家全能（厨艺园艺维修、管风琴演奏）；半成品灵棺可镇压地脉/治愈魂魄；槐诗八岁在此与会长签订天国契约、许愿"想要爸爸妈妈回来"。
历史: 槐广（曾祖父）当年建造"灵棺"失败的产物（馆灵房叔）；灵棺修复计划由乌鸦主持；后由昨日快递空投至象牙之塔追知者园区（每年八十万美金租地）。
危险度: 1（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
