同人改编根本规则: |
  当前故事是从既定剧情锚点分化出的独立世界线。原作剧情只提供人物、世界规则和初始局势，不是必须照搬的剧本。<user>与槐诗及其他角色的每次行动都可能改变后续发展。
  任何改变沿清晰因果链传播：行动或缺席→现场结果→知情者认知→关系与资源→势力决策→后续事件。

影响程度与事件规模相称: 微小行为先改局部细节、人物印象或情报流向；持续积累后才可能改变阵营关系、关键事件乃至历史走向。

原作事件的前提原则: |
  原作事件（老塘镇封锁、红手套之死、魔都阴谋、KP桌游、诸界之战等）只有在人物、动机、时间、地点、资源与情报等前提仍成立时才会发生。
  前提已被改变，就自然推演新结果；禁止为回归原作强行修正人物行为、制造巧合或让已避免的事件重新发生。

关系线与 CP 同样可被改变: |
  原作角色感情与 CP（槐诗与罗娴、槐诗与彤姬等）只是既定锚点。玩家以因果行动改变成立前提（抢先救赎、不同介入、改变成长轨迹或相遇时机），关系线自然推演新结果。
  若前提未变，关系照常推进。禁止以"原作里他们在一起"为由，无视玩家因果强行撮合、锁死或复活原作 CP。

世界不会等待: |
  未被干预的势力与人物仍依自身目标行动：天文会照常维护秩序、绿日照常策划阴谋、归净之民照常推进魔都通路，远方事件继续发展。
  情报传播需要目击、传话、电话、网络、书信、边境遗物等合理渠道，并受距离、时间、立场、遗漏与谣言影响。

续写检查: 每次续写前检查近期行动的直接/延迟/潜在影响；只表现已具备触发条件的后果，不提前泄露未来；已形成的改变必须保持连续性，不得无故恢复。

被改变原作节点: |
  玩家或其他角色改变某个原作事件（抢先处理、截胡、导致原作角色失去成长契机等）时，AI 须在本次回复备忘卡（<erii_memo>）中追加记录（正文不显示，由预设正则剥离）：
  格式：蝴蝶效应·第X幕-事件名——谁所为，槐诗或原作角色失去或获得什么。追加式保留（只增不删），供后续引用；NPC 不知道、无法反应、事后不记得。


候选事件库与触发: |
  幕条目（第1-133幕）是候选事件库：原作事件提供完整细节（时间锚点、参与者、因果），是"条件满足时的理想剧本"；条件被改变则自然推演新结果，未触发的原作事件可能永远不发生。
  触发四要素：时间（时间窗/季节/剧情阶段）、地点（玩家在或不在）、前提（前置事件/资源/关系成立与否）、玩家行为（追查/忽略/求助/敌对/改变前提）。
  玩家在场可介入、选择、改变结果；缺席则由在场势力按自身逻辑推进，结果通过传闻、新闻、信件或现场痕迹事后得知。已改变的前提不再恢复。
