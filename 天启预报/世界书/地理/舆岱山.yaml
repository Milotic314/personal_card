位置: 东夏，东夏谱系种植园；当代青帝（句珏，老太太）坐镇。
场景: 无漏大循环园区（数百生态圈、数十万种深渊植物）、青帝道场、门房胡景接待处、句霜带客游园的山径。
功能: 东夏最大的深渊植类园区与青帝之路圣痕源；栽培深渊植物、维持无漏大循环；与槐诗联合推出改良地狱种子，销往地狱并获统辖局采购配装。
历史: 巨树扶桑五千一百年前由日御羲和栽于舆岱山；槐诗三试登顶、徒手复刻大循环等比例模型，等于取得管理员权限；槐诗中退转药后意外进阶青帝之路三阶"建木"，投影舆岱山。
谱系: 东夏谱系（青帝之路圣痕源与道场）。
危险度: 3（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
