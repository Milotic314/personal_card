# 《天启预报》同人卡 · 创作规划（v1）
# 粗略规划模式：细节（条目正文）留到创作阶段逐条确认。来源：design-spec.md + 剧情/人设/玩法草稿。

project:
  name: 天启预报
  worldbookName: 天启预报
  form: charactercard
  mvu: true
  ui_mode: frontend   # 最终预期交互式状态栏/入世卷（tavern-ui）；现阶段开场白为叙事式轻量建卡
  # avatar: 待定（暂无头像图，先以 json artifact 打包；后续提供头像可改 png）

world:
  overview: 半架空现代都市超凡世界（公元2110年）。现境（人类文明，三大封锁庇护）之外是边境与地狱（旧世界残骸堆积成的已死世界）；毁灭要素虎视眈眈。穷学生槐诗捡到命运之书，卷入现境与地狱的万年棋局。玩家以完全自由自定义的原创角色入场，可改变原作走向。
  regions:
    - name: 现境·东夏
      scenes: [新海市, 石髓馆, 老塘镇废墟, 青秀山, 升华者集市, 魔都, 金陵, 象牙之塔, 丹波内圈]
      description: 人类文明庇护所，三大封锁覆盖
    - name: 边境
      scenes: [暗网, 无尽之海, 香巴拉, 灰岸, 移动边境]
      description: 现境之外的过渡地带，主权稀薄
    - name: 地狱/深渊
      scenes: [黄昏之乡, 雷鸣白原, 锈蚀塔林, 至福乐土外沿, 铁晶座, 雷霆之海]
      description: 已死世界的坟墓，深度编号越高越危险
  factions:
    - name: 天文会体系
      description: 维护现境秩序（含统辖局/存续院/铸铁军团/原暗部队）
      key_members: [艾晴, 叶戈尔, 老肖, 灰衣人, 沙赫]
    - name: 东夏社保局
      description: 东夏官方超凡机构（特事处/社保局）
      key_members: [玄鸟, 符残光, 叶雪涯, 诸红尘, 傅处长]
    - name: 象牙之塔与天国谱系
      description: 理想国遗留，罗素重建；槐诗主战场
      key_members: [罗素, 艾萨克, 彤姬, 雷蒙德, 陈女士]
    - name: 绿日
      description: 地狱侧势力，佩伦统领，十灾
      key_members: [佩伦, 劳伦斯, 柳东黎, 红手套]
    - name: 归净之民
      description: 牧场主崇拜，魔都通路阴谋
    - name: 黄金黎明
      description: 理想国分裂产物，无何有之乡
      key_members: [玛瑟斯, 伍德曼, 维斯考特, 亚雷斯塔]
    - name: 瀛洲鹿鸣馆与将军
      description: 瀛洲华族公家机构
    - name: 地狱侧诸王
      description: 枯萎之王/雷霆大君/赫笛/小猫乐园等

characters:
  - name: 槐诗
    basic:
      age: 17（2110开局）
      gender: 男
      identity: 世界核心角色（AI 扮演）；天问之路升华者、命运之书持有者、天文会监查官
      relationship: 玩家的主要互动对象之一（可结盟/敌对/改变其命运，不可操控）
    personality:
      base: 咸鱼乐天、嘴硬心软、守护成性
    tri_faceted: false
  - name: 彤姬（乌鸦）
    basic:
      age: 不详（神明级）
      gender: 女
      identity: 槐诗的契约者与导师、命运之书化身、前东夏神明帝俊
      relationship: 能"看见命运"的存在，会注意到玩家的异常
    personality:
      base: 居高临下温柔+甜腻宣布主权、解说狂魔
  - name: 艾晴
    basic:
      age: 与槐诗同年段
      gender: 女
      identity: 天文会监察官→统辖局专员→架空楼层最高负责人
      relationship: 童年玩伴/上司/冤家
    personality:
      base: 惜字如金、面冷心黑、深情克制
  - name: 柳东黎
    basic:
      age: 成年
      gender: 男
      identity: 会所一哥→暗线监察官、时间跳跃者
      relationship: 损友、可托付后背
    personality:
      base: 轻佻谜语人、沧桑重情
  - name: 罗娴
    basic:
      age: 约26（资料库17推算，2026-08-28 裁决）
      gender: 女
      identity: 罗老之女（深渊造物）、武道天才
      relationship: "想要杀死槐诗的初恋"，玩家可介入其救赎线
    personality:
      base: 纯粹、不懂感情、行动派
  - name: 莉莉（海拉）
    basic:
      age: 存在以纪元计（自称四岁半）
      gender: 女
      identity: 贤者之石人造人→创造主
      relationship: 温柔澄澈的创造主
    personality:
      base: 温柔、澄澈、句式干净
  - name: 傅依
    basic:
      age: 与槐诗同班
      gender: 女
      identity: 班长→存续院缄默者
      relationship: "好兄弟"
    personality:
      base: 优等生外壳、内心叛逆
  - name: 白帝子·褚清羽
    basic:
      age: 15
      gender: 女
      identity: 东夏谱系第二、五阶受加冕者（圣痕凤凰）
      relationship: 路痴武力天花板
    personality:
      base: 至烈至锐、天然路痴、行动派
  - name: 罗素
    basic:
      age: 112
      gender: 男
      identity: 象牙之塔校长（真身洛基/密米尔）、谎言之王
      relationship: 操盘者/老师
    personality:
      base: 老阴批、乐子人、护短
  - name: 罗老（罗肆为）
    basic:
      age: 中年
      gender: 男
      identity: 果园健身房总教头、罗娴之父
      relationship: 授业恩师
    personality:
      base: 干脆、武人、决绝
  - name: 房叔
    basic:
      age: 外观老人
      gender: 男
      identity: 石髓馆馆灵
      relationship: 槐诗唯一的亲人
    personality:
      base: 和煦慈祥、管家腔
  # NPC 见 entries：老杨/王海/凶猿/红手套/戚问/戚元/何洛/老肖/玄鸟/叶雪涯/符残光/原照/原缘/林十九/郭守缺/里见琥珀/里见真希/剑圣上泉/佐佐木清正/赫笛/小猫/别西卜/灰衣人/神城未来/宫本弦一郎/马库斯/应芳州/陈女士/雷蒙德/浮士德

style:
  perspective: 第二人称（玩家所见即所得；AI 扮演所有原作角色）
  tone: 风月式——吐槽流外壳+中二浪漫内核；短句顿挫、音乐化与炼金化比喻
  mood: 燃 + 暖 + 克制的悲壮；HE 底色
  reference: 风月《天启预报》原作文风（15_文风样本.md）

entries:                      # 创作顺序（分组），项目级事实来源
  # ── 扮演准则（before_char，常驻）──
  - name: 叙事基调
    type: 扮演准则
    path: 世界书/扮演准则/叙事基调.yaml
  - name: 蝴蝶效应
    type: 扮演准则
    path: 世界书/扮演准则/蝴蝶效应.yaml
    purpose: 同人改编因果规则；含"被改变原作节点"输出要求（<divergence> 标签，正则显示隐藏，见玩法/02）
  - name: 防全知
    type: 扮演准则
    path: 世界书/扮演准则/防全知.yaml
  - name: 战力判定
    type: 扮演准则
    path: 世界书/扮演准则/战力判定.yaml
  - name: 战斗规则
    type: 扮演准则
    path: 世界书/扮演准则/战斗规则_速查.txt
    purpose: d20 叙事回合制战斗速查（C 档）：公开检定/阶位档值/破阶/伤害/HP/战斗负荷/濒死/距离掩体；含内联 EJS 骰池
  - name: 战斗规则-细则
    type: 扮演准则
    path: 世界书/扮演准则/战斗规则_细则.txt
    purpose: d20 战斗细则（按需触发）：公开检定格式/叙事回合/先手/攻击/防御反应/范围攻击/治疗/战斗结束
  - name: 扮演准则_GM
    type: 扮演准则
    path: 世界书/扮演准则/扮演准则_GM.yaml
    purpose: AI 兼任 GM 职责细则（旁白/判定/推进/以玩家为中心不围着转）；正文输出纪律（无系统语言/变量/标签等元信息，纯叙事沉浸）；玩家侧防全知（情报靠玩家行动与推断获得，AI 不替玩家揭示未知）
  - name: 玩家角色档案引导
    type: 扮演准则
    path: 世界书/扮演准则/玩家角色档案引导.yaml
    purpose: 入世卷轻量建卡引导（时间线落点/身份/能力/背景/关系）
  - name: 晋升方式
    type: 扮演准则
    path: 世界书/扮演准则/晋升方式.yaml
    purpose: 圣痕进阶规则+命运之门机制
  - name: 随机事件系统
    type: 扮演准则
    path: 世界书/扮演准则/随机事件系统.yaml
    purpose: L1 规则壳（触发/开关/收尾铁律/通用种子池）
  - name: 世界时钟
    type: 扮演准则
    path: 世界书/扮演准则/世界时钟.yaml
    purpose: 沙盒时间推进（条件推进/玩家缺席世界照走/时间锚点）
  - name: 事件条件化
    type: 扮演准则
    path: 世界书/扮演准则/事件条件化.yaml
    purpose: 段条目降级为候选事件库；触发条件四要素；在场/缺席双写
  - name: 探索规则
    type: 扮演准则
    path: 世界书/扮演准则/探索规则.yaml
    purpose: 开放区域/NPC 日程/情报获取（防全知落地）
