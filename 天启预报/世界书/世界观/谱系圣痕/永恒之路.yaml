路线: 永恒之路（源自埃及谱系，侧重破坏的领域，结合诸多学者与炼金术师的研究成果；所有圣痕都以物质形态具现，圣痕只是基础、更多需靠物质补充加装——最氪金的升华之路，越氪越强、不氪白板）
触发词: 永恒之路、骑士、命运战车、戈尔迪乌姆、太阳船、阿努比斯、荷鲁斯、奥西里斯、天狱堡垒、冥府巨人
圣痕:
  - 骑士（一阶）：战斗力全在坐骑之上，不限于炼金重型摩托甚至外骨骼装甲。
  - 命运战车·戈尔迪乌姆（三阶）：以人类献给天空与雷霆之神的战车为名，天命真意是将自我凌驾于命运之上，突破必死的命运困局、打开新的通路。
  - 太阳船（四阶）：传说中承载拉神、环绕现境运转的奇迹结晶，永恒之路代表性进阶之一，几乎可视作威权遗物太阳船的人间再现；舍弃诸多攻击力，换来作为容器的稳定性与坚固。
  - 审判天平·阿努比斯（四阶）：奥西里斯的前置，可产生强力深度场、随时在六个深度内任意迁跃；专长全点战争之上的毁灭者，不折不扣的人形兵器。｜进阶条件：奥西里斯的前置
  - 天狱堡垒·荷鲁斯（五阶）：以统和移动基地、后勤供应与战时指挥部为目的设计的深度移动都市，最多可容纳数百名永恒之路升华者协同操作，人越多发挥的作用越强。
  - 冥府巨人·奥西里斯（五阶）：又名冥府审判机装、地狱歼灭机装，代号冥神的要塞级作战兵器，一旦降临战场便代表审判之日到来；固有天赋对一切地狱生物造成百分之百伤害，不可削弱、不可豁免、不可阻挡。｜进阶条件：将一座地狱改造机械化（改造型进阶）
