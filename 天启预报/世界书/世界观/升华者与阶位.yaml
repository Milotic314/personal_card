升华流程: 应激期（人性自白银之海超脱、源质独立归还意识）→ 发育期（灵魂影响肉体、逼近常人极限）→ 依次进阶。

阶位表（数字阶 ↔ 名词阶，强制映射）:
  - 一阶·水银：以炼金术的汞、盐、硫将体内化为源质沃土，形成承载圣痕的容器。
  - 二阶·黄金：在谱系中踏出关键一步、决定未来方向。
  - 三阶·以太：器官"以太化"改造，彻底告别人身限制。
  - 四阶·星锑：灵魂与圣痕彻底融合完成质变，人形哥斯拉级肉体，获得撬动物理根基的超凡视界。
  - 五阶·贤者之石：升华之路的极限与顶端，奇迹在人间的化身，圣痕唯一，死后追认为圣骸。
  - 天敌：突破极限成为神明化身，"行走在人间的神明、人形的地狱"，世上仅七位（数字阶之外，规格外）。

铁律: 数字阶名（一阶~五阶）必须先按本表映射为名词阶位，再写入变量或正文称呼；禁止把"三阶"当作阶位值直接写入。应激期、发育期是水银前的过渡档，不计入五阶数字。

受加冕者: 传承"天命"的存在，不循常理、多为孤例、无法以圣痕承载；非设常，除非符合某种条件否则不会出现。
