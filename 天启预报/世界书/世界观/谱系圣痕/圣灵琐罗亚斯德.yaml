谱系: 圣灵谱系——曾经的天下第一大谱系、主宰欧洲，后分裂为罗马与俄联谱系；琐罗亚斯德谱系（波斯谱系）——传承"二宗三际"五条升华之路，几百年前出过一位天敌，"查拉图·斯特拉如是说"以其部分源典为基石

代表圣痕:
  - 弥赛亚/撒旦叶（五阶）：经《圣典》创造出的圣灵与恶灵｜与俄联谱系共有之名
  - 智天使/座天使（五阶）：经《圣典》创造出的圣灵｜与俄联谱系共有
  - 权天使（四阶）：圣灵谱系的钢铁天使
  - 吸血鬼（三阶）：赎清罪孽后升华为权天使
  - 人狼（三阶）：神灵后裔｜雷飞舟自称"狼人"，实为神明造物"人狼"
  - 不净者（二阶）：圣灵谱系二阶
  - 信徒（一阶）：圣灵谱系一阶｜莉莉初始圣痕
  - 光王（五阶）：传承自摩尼教光明王国的主宰
  - 五明子（四阶）：光王所创五种光明原素——净气、妙风、明力、妙水、妙火
  - 五类魔（四阶）：摩尼教暗国的群魔｜安萨利"暗国之灯"黑暗之衣
  - 灯灵（三阶）：传承自阿拉伯神话传说中的生物｜暗国之灯相关
