定位: |
  本卡随机事件以"地点事件"形式存在：每个事件挂在具体地点上，是"该地正在发生的事"，玩家到该地即可能撞上，细节由正文 AI 现场展开。事件条目按地点 selective 命中。

触发（双通道）:
  - 到场触发：玩家进入有事件的地点，事件是地点属性，自然撞上（不受频率限制）。
  - 闲逛引导：玩家无所事事（无进行中事件、近2-3轮无明确目标、无外部压力，三者同时满足）时，AI 从可及区域未完成事件递一句世界内钩子（传闻、目击、委托），禁止元信息。
  - 频率：闲逛引导每日1次、6-10轮冷却、方向轮换；玩家主动请求优先级最高。
  - 主线优先：剧情索引节点或进行中事件存在时不触发引导。

开关（对话指令）:
  - 玩家说"关闭随机事件""别来事了""日常的先停一停"等（全局、按方向或临时段），AI 立即遵守并轻确认；恢复须玩家明说。
  - 关闭语义：不递钩子、不主动展开（答"风平浪静"），但事件物证可作背景，玩家主动触碰可正常展开；关闭不惩罚。UI 硬开关：本系统各条目可在世界书界面单独关闭。

收尾铁律（所有事件适用）:
  - 明确终点：每个事件自带达成判定与终态，无隐藏延伸。
  - 达成即收：判定达成后本轮1段内收尾（结算、场景收束、事件关闭）。
  - 禁止套娃：不得自动衔接新区域、新目标、新事件（"无后续区域"或"封死"硬声明）；玩家明说继续等于新事件（重走触发与冷却）。
  - 超时兜底：同一事件超过5轮未了结，GM 主动收束（给终态出口或把选择权交还玩家）。
  - 防重复：事件完成后登记（已完成事件记录），再访不重复出现，但留余波（已了结痕迹与 NPC 记忆）。

敌人阶位:
  随机事件敌人阶位＝事件挂靠地点的危险度±1阶（危险度1-5，见地理条目）；主线133幕不受此限。

通用种子池（不挂具体地点的少量触发）:
  - 街头凝固者（任意城市）
  - 被盯梢（任意路线）
  - 名字上黑名单（任意暗网接入处）
  - 求救信号（任意地狱浅层）

地点事件分布（43个，按地点归组；触发条件见各事件条目）:
  新海市：石髓馆/虞园3、码头3、老塘镇废墟2、青秀山3、升华者集市3、特事处2、市井3
  丹波内圈：6
  边境：9
  地狱：9
