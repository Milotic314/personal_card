圣痕: |
  通过回溯奇迹的残痕寻找通往神圣的道路，对神明进行模仿、对神的权威与残痕调查后，"再现的奇迹被赋予形体之后的称呼"。
  以金属和熏香组成秘仪制造，普通人也能使用。成长需求各异：辅助型最容易，功能型次之，攻击或侵略型大多须在杀戮破坏中进阶。

圣痕之名源于疤痕（外在表现）: |
  "圣痕"之名来自升华者进阶后身上浮现的疤痕——必有外在痕迹，且与名号呼应
  （无头骑士→脖颈斩首形环形疤、缝合人→缝合痕+异色皮肤、狼人→刀锋利爪、山鬼→墨绿血管纹身随心跳搏动、信徒→头顶隐约光环）。

圣痕两态（静默/激发）: |
  静默（常态）：平时仅以痕迹存在、无力量波动，官方检测"未侦测到高位圣痕活动迹象"。
  激发（运转）：催动源质"唤醒/苏醒/运转"圣痕，痕迹活化放大、异象显现（红日映照、半人半虎、胸口裂隙、背后虚影）。
  铁律：日常/激发只描述【外在痕迹与异象】，不是能力；能力（主动/被动）一律写进「技能」。
  例：骑士日常=「手背浮现淡金纹路」，激发=「纹路亮起、全身金属冷光」；"机械直觉提升"属于技能，不写在圣痕形态里。

圣痕阶位与意象（铁律）: |
  圣痕与阶位一一对应（玩家与NPC通用）：水银=一阶、黄金=二阶、以太=三阶、星锑=四阶、贤者之石=五阶，禁止跨阶；数字阶名必须先映射名词再取圣痕/写变量，禁止直接写"三阶"。
  应激期、发育期（水银前）取该路径一阶圣痕（阶位记为应激期/发育期），到水银才正式成为一阶。
  意象原则：低位具体、高位神话——一阶给具体小物/凡物意象（阴魂/礼魂、小红帽、骑士、信徒、狼人、缝合人），禁止一阶就给白泽/凤凰/东君/洛基/玄鸟这类高位神名。
  具体某路径某阶位取哪个圣痕，以「谱系圣痕速查」为准；未列出的路径按相邻阶位意象类推。
  谱系与路径相互隔离：天问之路一阶=礼魂/阴魂、永恒之路一阶=骑士，禁止跨路径取圣痕；跨谱系同理（须有原作依据）。
  原文没有该路径该阶位的圣痕时（如神髓之路无一二三阶、维持之路从不动明王四阶起），由正文 AI 按该路径气质现场生成，遵循阶位意象铁律，不得挪用其他路径/谱系。
  原创谱系/圣痕同样遵守：低位具体、高位神话，不得一阶就塞五阶神名。
  圣痕替换/进阶只换称谓与意象，已获得的技能不消失——如山鬼进阶少司命，山鬼时期的技能仍在，随进阶升级增补、不删除（技能跟着人走，不跟着圣痕称谓走）。

谱系:
  - 天国谱系（深渊谱系）：77 种圣痕、九条完整升华之路，最适合深度地狱探索。
  - 六大谱系：东夏、罗马、埃及、俄联、天竺、美洲（各有一位凌驾五阶之上的天敌）。
  - 其他：圣灵、瀛洲（化物）、琐罗亚斯德、新罗、冰海、牧场主等谱系。

谱系-之路-圣痕结构（铁律）:
  - 完整三层：谱系 → XX之路 → 圣痕（如 天国谱系·天问之路·山鬼）。
  - 天国谱系有九条命名之路（天问/黄昏/永恒/神髓/维持/变化/原始/循环/乐园，另有原罪之路·未完成草创），之路名固定；东夏谱系亦有十八条命名之路。
    其余谱系多数无固定之路名，此时「之路」由正文 AI 依该谱系气质现场生成（或省略之路、谱系直接连圣痕），不得硬套天国谱系路名。
  - 之路相互隔离：晋升沿当前之路圣痕链递进、不跨之路不跨谱系（细则见「晋升方式」）。

无谱系特型: 如槐诗的"事象分枝"（乌鸦以源质炼制的金属羽毛）。

圣痕特性: |
  圣痕可融合（御神刀·怨憎与鸦群融合）、可重铸（赫利俄斯工坊重铸源质武装）；可被铸造、移植、退化、吞吃；谱系间可跳转（如九凤从东夏跳转天竺）。
