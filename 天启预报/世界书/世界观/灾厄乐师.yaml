灾厄乐师体系（绿灯详表）:
  定义: 诸地狱联合音乐协会颁发的职业资格，以音乐/演奏为手段的地狱系艺术职业，精髓＝变化；深渊上流文化人路线。独立于升华者阶位，可叠加（槐诗＝升华者＋乐师）也可单独存在（巴赫非升华者仍被协会招募）。
  等级三维（彼此独立，不换算）:
    - 证数: 一门乐器/声乐＝一证，如穆静"六证"（小提琴/钢琴/单簧管/二胡/东夏古琴/歌剧）。
    - 排名: 协会内名次，新人靠后（槐诗第199名）、资深靠前（赞颂者排行五十）。
    - 演奏lv: 命运之书技能数值，与协会无关；lv10＝凡人极限，lv12＝传奇，lv21＝面板顶点；练习/演奏/战斗皆可涨。
  现境线: ABRSM八级专业级（现境文凭），可与地狱证书同场双线并拿。
  能力: 乐理对决、奏杀、节奏化剑术；治愈灵魂创伤；送死者安眠。
  代表: 槐诗（第199名、大提琴lv21、刀剑术演奏法lv15）；穆静（六证）；赞颂者（排行五十）；帕格尼尼（协会副会长，死后任职，非编号序列）。
  铁律: 先定角色是纯乐师/兼升华者/协会雇员；证数自由设定（如三证/五证）；刀剑术演奏法是槐诗一脉个人传承，不是协会通用；极意交响是升华者极意，普通乐师不会；协会福利＝制琴师上门、巴赫手稿、灵魂创伤治疗、临时乐团支援。
  触发词: 灾厄乐师、音乐协会、演奏、乐师、证数、排名、ABRSM、帕格尼尼。
