mvu:
  structure: |
    顶层结构（参考卡2 架构 + 本卡功能）：
    ├── 当前时间
    │   ├── 日期 / 时刻
    ├── 当前地点
    │   ├── 名称 / 区域 / 环境
    ├── 当前事件
    │   ├── 名称 / 阶段 / 场景物品
    ├── 战斗状态
    │   ├── 是否战斗中 / 当前回合 / 参战角色 / 行动顺序 / 当前行动者 / 行动额度 / 上次检定
    ├── 玩家档案
    │   ├── 基础（姓名{{user}}/性别/年龄/当前身份/当前势力/种族/谱系）
    │   ├── 战力（基础阶位/当前阶位/爆发态/极限态）——阶位+上下位
    │   ├── 圣痕与灵魂能力（效果/发动负荷/使用条件/特殊限制/破阶标签）
    │   ├── 装备（当前武器：基础伤害/命中修正/破阶标签/有效距离/状态）
    │   ├── 状态（当前形态/当前状态/伤势/濒死/生死状态/掩体状态）——参考卡2 C 档战斗
    │   └── 成长（下一目标/里程碑条件[掌握·实战·代价或稳定性]/已完成里程碑[达成目标/完成于事件/时间/前后阶位]）——晋升方式+命运之门追踪
    ├── 物品栏
    ├── NPC档案
    │   ├── 角色表（key=规范名，字段含 别名[]/在场: true|false/当前位置/当前行动/与主角关系/好感度/与主角距离/当前情绪）
    │   │   └── 在场=true 全字段；在场=false 精简骨架（位置/行动/一句话）
    └── 系统
        ├── 已完成事件（追加式：hm01,hm02，只增不删）
        ├── 随机事件（开关 on/off / 冷却 / 上次方向）
        └── 当前目标（探险单槽位）
  variables:                # 待细化：取值范围与格式约束待 schema-agent 阶段补充
    - path: 当前时间.日期
      format: YYYY/MM/DD
      description: 沙盒世界时钟
    - path: 当前时间.时刻
      description: 时段
    - path: 当前地点.名称
      description: 玩家当前所在区域/地点
    - path: 当前事件.名称
      description: 进行中的事件
    - path: 战斗状态.是否战斗中
      type: boolean
      description: 战斗状态（C 档 d20 战斗系统，含回合/行动额度/上次检定）
    - path: 玩家档案.战力
      type: object
      fields:
        基础阶位: string
        当前阶位: string
        爆发态: object
        极限态: object
      description: 阶位（不入阶/一至十九阶·上下位），参考卡2 档值换算
    - path: 玩家档案.圣痕与灵魂能力
      type: z.record
      description: 技能表（只增不删；字段：效果/发动负荷/使用条件/特殊限制/破阶标签）
    - path: 玩家档案.成长
      type: object
      fields:
        下一目标: string
        里程碑条件: z.array
        已完成里程碑: z.array
      description: 晋升追踪（晋升方式+命运之门）：条件类型 掌握/实战/代价或稳定性；完成记录带事件与前后阶位
    - path: 玩家档案.当前武器
      type: object
      description: 主武器（基础伤害/命中修正/破阶标签/有效距离/状态）
    - path: NPC档案.角色表
      type: z.record
      description: key=规范名（别名存字段防分家）；在场 true/false 布尔；在场全字段/离场骨架
    - path: 系统.已完成事件
      type: z.array
      description: 已完成事件标记（只增不删，参考卡2 数组+上限+remove 最旧）；位标记 ID 如 hm01
    - path: 系统.随机事件开关
      enum: [on, off]
      description: 全局开关
    - path: 系统.随机事件冷却
      type: number
      description: 冷却计数（轮）
    - path: 系统.上次方向
      enum: [日常, 战斗, 探险, null]
      description: 方向轮换
    - path: 系统.当前目标
      type: string
      description: 探险目标单槽位（可选）

first_messages:
  - format: 叙事式
    word_count: 300~600
    output_path: 开场白/0.txt
    scene: 2110年·新海市·命运之书觉醒前夜
    opening_situation: |
      玩家以自定义角色进入新海市（默认前夜：槐诗还没捡盒）。
      叙事式开场建立场景与氛围，给出"三选一引线"（如码头怪象/深夜琴声/小巷传闻三个可接可不接的钩子），
      结尾以"入世卷"五步建卡引导收束（时间线落点/身份/能力/背景/初始关系），
      AI 生成【玩家角色档案】后世界开始运转。
