定义: |
  源质典籍是神迹刻印类典籍，承载"书中内容可再现为奇迹"的力量，介于源质武装与神迹刻印之间。

锚点（几本已知典籍，供正文定位威力级别）:
  - 《蝇王》：奥西里斯雷达/中央智能，普通战斗以"阿密特左轮手枪"形态出现。
  - 《战争与和平》：战争法典（广域进攻增益）/和平条约（回复光环），黑白猫形态切换。
  - 《国殇》：天问之路象征，可将大群圣痕全部拔升一阶。
  - 《海底两万里》：地狱战舰·鹦鹉螺号，战略级。

获取: |
  源质典籍并非槐诗专属，玩家有机会获得别的源质典籍（原作典籍或原创典籍）。

效果生成: |
  源质典籍的效果由正文 AI 根据典籍主题现场编定，不必预先写死：
  - 锚点＝"以典籍主题再现奇迹，威力对标《蝇王》《战争与和平》这一级，不凭空超出"。
  - 每本典籍只有 1~3 个与主题强相关的核心效果，威力由正文情境与持有者阶位决定。
