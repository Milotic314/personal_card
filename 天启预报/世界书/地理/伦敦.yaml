位置: 现境英伦，初代天文会草创地；伦敦天文会本部所在。
场景: 伦敦六岛无人区、格林威治天文台（初代天文会草创处）、伦敦天文会本部（地下架空楼层）、音乐之友协会、三叶大厦、格林威治公园、凯旋银行保险库（再生计划沙盒内景）。
功能: 天文会本部所在地；ABRS 等级考试通行地；罗素在此馈赠槐诗地狱哨站；终局再生计划以整个伦敦为密闭沙盒，先导会降下白银之海进行"混沌运算"。
历史: 初代天文会于伦敦六岛草创；枯萎之王御驾亲征伦敦；再生计划十日内战、所罗门军变，吹笛人借漏洞潜入白银之海、被槐诗以辉煌之光斩杀；伦敦沉入现境地心，为天国之基。
谱系: 无
危险度: 3（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
