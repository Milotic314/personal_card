谱系: 瀛洲谱系（化物谱系）——受天国谱系影响改造圣痕，创出统称"能"的数条升华之路，由隐秘机构"座"把持，上皇具现人神属性

代表圣痕:
  - 日巫（卑弥呼，五阶）：对应瀛洲历史中的女王｜邪马台日巫容器计划
  - 建御雷神（四阶）：源自瀛洲神话源典的雷神，可操控雷电、身化雷霆｜神田苍真
  - 鸦天狗（四阶）：山伏术法之外剑术更盛，同源六式秘剑"天狗胜"｜天城坊
  - 百目鬼（四阶）：张开千百只邪眼，以视线传递诅咒｜无归者之墓杀手
  - 密迹金刚（四阶）：药叉的正统进阶，相关神性由各大寺庙把控
  - 茨木童子（四阶）：瀛洲大妖怪，罗生门的上位圣痕
  - 金熊童子（四阶）：大江山四天王之一，面如金漆、头生双角、身躯庞大｜九条无限
  - 镰鼬（三阶）：能制造锋锐的气刃｜角山
  - 发女（三阶）：百目鬼的下级圣痕，以头发寄托恶孽源质与诅咒、吞食生命
  - 弱法师（三阶）：隐秘进阶，得"侲子"之力，可完美伪装亲手所杀的升华者｜顾越
  - 般若（二阶）：恶道结晶、蚕食怨恨，掌控不了怨恨反被怨恨吞吃｜里见琥珀原圣痕
