凝固者: |
  主动拥抱地狱侵蚀、饮黑血而堕落的升华者，力量暴涨但人性流失（如戚元、千叶龙二、外道王）。
  凝固倾向可被观测（监测环），可通过"不完整凝固"技术利用（佩伦改造柳东黎）。

侵蚀体: |
  由畸变源质滋生、侵蚀现境活物的怪物（饕餮之种、报应魔、影兽）；
  高阶侵蚀体可寄生伪装（连源质波动都能模仿，如寄生金沐的边境异种）。

地狱沉淀与源质瘟疫: 梦想病、Ω型嗜虐症、深度症候群、心灵裂变（现境大敌）。

凝固阶位（彻底凝固后的升级路线，与升华阶位对称反向）:
  - 授名者：有自我意识的地狱生物得到统治者恩赐、被赋予独一无二的名讳，从怪物中超拔而出。
  - 着衣者：知晓廉耻、脱离天性蒙昧，进阶全新形态，追求更高智慧与力量源泉。
  - 冠戴者：被统治者承认眷属、知晓礼节秩序尊卑，成为深渊使者，可指挥同类。
  - 统治者：制定规则、驾驭无穷深渊大群的地狱至上者，与地狱融为一体、形骸无意义。
  - 地狱之王：统治者中最高地位与尊荣（石之母、枯萎之王、雷霆大君等）。
