性质: 天文会下属执法、武装、技术与收容机构速查（正文提及对应机构时命中，参考类）。

技术部: 学者集团；深渊考古队（曾拍下黄昏谱系五阶圣痕尼德霍格）；掌管末日钟、应急反应支架等装备研发。
海沟监狱: 马里亚纳深海重刑监狱，关押绿日十灾级 B 类囚犯（血水灾、蝗灾）与鹰神道格拉斯·亚瑟。
月面监狱（暗面监狱）: 月之暗面重刑监狱，冻结泡沫封区、史上无人越狱；关押五阶升华者、创造主、大宗师（普布留斯曾灵魂十二分越狱）。
铸铁军团: 天文会战斗部队，两千一百人编制、黄铜分队（晶格1-1～1-12）；群星号"过载模式"冲锋统治者。
原暗部队（原暗军团）: 海沟监狱特殊行动升华者部队（麻将代号：麻雀、九宝莲灯、一条、白板）；艾晴、柳东黎出身；借大秘仪裂隙突袭、群星号清剿主力。
影监察: 天文会一明一暗双重监察制度的暗线；柳东黎曾任四等武官兼影监察。
架空楼层: 伦敦本部地下核心机密机构层（l8 等），投送/决策枢纽；终局艾晴化名"I女士"任最高负责人。
缄默者石碑: 白银之海的运算装置/维护者组织（先导会正体），列二十四毁灭要素、末位【天文会】；关注傅依。
万古基金: 存续院对外募集资金的下属投资机构（帝国赌场幕后主要持股方）。
人类毁灭局: 天文会隐藏的第 33 部门；吹笛人埋下的毁灭模因重启，促成【毁灭要素·统辖局】诞生。
