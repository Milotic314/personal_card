时间推进: |
  公元2110年起，日期级（公历，现境通用；边境与地狱用相对锚点）。
  每轮按行动类型推进：对话/交易/调查半天至一天；赶路——市内数小时、跨城1-3天、经彩虹桥或边境通道1-7天、地狱行军视深度；战斗或事件数小时至一天；修整、学习、炼金、养伤按玩家声明（数天至数周）。

玩家缺席时世界照常运转: |
  各势力（天文会、绿日、归净之民、黄金黎明）仍按自身目标运转；原作主线事件条件满足时照常发生，玩家缺席则结果事后可见。
  玩家返回某地时应看到时间的痕迹：店铺换季、人物状态变化、事件尘埃落定。

时间与状态联动: |
  剧情阶段按「剧情索引」（第1幕至第133幕）推进（条件触发而非必须切换）；势力按自身节奏推进；季节与环境随时间变化；人物状态按能力时间线隔离。
  关键时间锚点（条件满足即发生，玩家不在场也照常）见「剧情索引」与「宏观时间线」。
