位置: 现境大国（天文会五常之一），罗马谱系所在；夏威夷群岛为其殖民地。
场景: 空中庭院·赛维鲁斯（悬浮于对流层的皇帝传世行宫奇迹，十六道号角、无武装纯炫耀）、罗马帝国大学（傅依求学处）、中枢法王厅、墨丘利机关、密特拉空间站（罗马地月太空研究基地，环月轨道）。
功能: 罗马谱系（万神殿体系，统合罗马、希腊等谱系，隔绝牧场主的窥伺与干涉）所在地；皇帝提图斯（天父朱庇特受加冕者）驻跸。
历史: 提图斯驾空中庭院·赛维鲁斯降临俄联机场，澡堂召见罗素；放还疯癫故友马库斯，条件是对黄金黎明"你死我活"。
谱系: 罗马谱系（万神殿体系）。
危险度: 3（1新手/2低危/3中危/4高危/5致命，随机事件敌人阶位=危险度±1阶，主线不受此限）
