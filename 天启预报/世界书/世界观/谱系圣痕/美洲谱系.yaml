谱系: 美洲谱系——异类与边境生物联合印加谱系而成的新世代谱系，开创者"白冠王"（曾为天国副君），存世最短、底蕴不足，需存世神灵支撑方能独立

代表圣痕:
  - 陨落晨星（五阶）：后人依白冠王神迹仿造的力量｜白冠王·赫莱尔·本·沙哈尔
  - 鹰神（五阶）：印第安传说中至高的动物神，金山之上统御地上万灵，几成美洲代表｜道格拉斯·亚瑟
  - 熊神（五阶）：美洲的大地守护者，能以岩石与泥土凝成熊神化身｜理查德
  - 羽蛇神（五阶）：当代谱系之主、七大天敌之一｜库库尔坎
  - 青冠龙（五阶）：吐息堪比时光的衰败之力，龙息过处万物衰亡｜范海辛 270 年后进阶
  - 维奇洛波奇特利（五阶）：阿兹特克神话中的战神、太阳神与南方统治者｜丽兹·赫特莫克进阶目标
  - 特拉尔特库特利（五阶）：受加冕者，无穷大地的化身，自海中走出弥补大地的神迹｜世界巨人，倾国之赌中身陨
  - 特克西斯特卡尔（五阶）：受加冕者，阿兹特克神话中的月神｜月之主
  - 细长鬼影（四阶）：可随意在阴暗处瞬移（奇美拉为缝合人的上位圣痕）
  - 左蜂鸟（三阶）：又称魔鹰，第一太阳泰兹卡特里波卡的五个化身之一｜丽兹初始圣痕
  - 缝合人/狼人/无头骑士（三阶）：被圣灵谱系打压、由欧洲流浪至美洲的异类圣痕（另有黑胡子、石像鬼、博什克瓦多什等）
